# 互动引导闸门（R11 内容诊断 2026-10-13「建议5」/ 计划 13.5「评论区运营」/ 计划 P2-9 涨粉）
#
# 由来：R11 真实数据——「粉丝阅读占比中位 0%（健康号 20-40%）、互动率仅健康号 1/3，
#   账号只吃推荐流量、权重上不去」。这是**唯一能打破「低推荐 → 低点击 → 更低推荐」死循环**
#   的抓手，但此前只写进了提示词（prompts/rewrite_article.txt 的「粉丝沉淀钩子·必须满足」），
#   **没有任何生成后校验** —— 写了等于没写。本文件把判据固化，由 interaction_bait.py 执行。
#
# 判据：正文（含 interaction_bait 字段注入后的最终稿）必须同时具备
#   1. 关注引导（粉丝沉淀钩子）：引导「关注/追更/订阅」的话术；
#   2. 互动引导（评论区运营）：可被读者直接回复的问题或站队/投票邀请。
#   两类都命中才判达标；缺任一类即打回重写（最多 2 次），最后一轮由保存侧模板兜底注入。
#
# 纪律（与全仓一致）：
#   - 正则**必须带引导语境**，否则「值得关注，这事闹大了」这类事实性用词会被误判成钩子；
#   - 配置不可用 → 放行并置 degraded，绝不因读不到配置而阻塞发布（计划九）；
#   - 本文件只描述判据与话术模板，不承载任何素材/事实。

版本: '1.0'
生效日期: '2026-10-13'
口径出处: 'R11 内容诊断 2026-10-13 建议5；计划 13.5（评论区运营）＋ P2-9（涨粉）；策略手册第三章'

判罚:
  分数: 0            # 与「赛果播报式」同级：缺互动引导视为不合格成稿
  动作: 打回重写
  提示: '成稿必须同时具备「关注引导」与「互动引导」：文末用一句贴合本篇的关注/追更话术收尾（如「关注老六，这转会窗的瓜我替你盯着」），并在正文或文末抛出一个读者能直接回答的问题（如「这球换你当裁判，吹不吹？评论区告诉我」）。两类缺一不可。'

# 条件一：关注引导（粉丝沉淀钩子）——必须带引导语境，避免「值得关注」类事实用词误判
关注引导:
  - '(点|加|戳|求|记得|别忘|顺手|不妨)[^。！？!?\n]{0,6}(关注|追更|订阅|收藏)'
  - '(关注|追更|订阅)[^。！？!?\n]{0,10}(不迷路|后续|老六|我)'
  - '不迷路'
  - '(关注|追更|订阅)(一下|我吧|我们|老六)'

# 条件二：互动引导（评论区运营）——读者可直接回复/站队/投票
互动引导:
  - '评论区'
  - '留言'
  - '(说说|聊聊|告诉|发表|亮出)[^。！？!?\n]{0,4}(你的|你|看法|想法|选择|观点)'
  - '(你|您|大家|各位)(觉得|怎么看|认为|选|站)|你们觉得|你怎么看'
  - '(抠|扣)1|扣一|扣个1'
  - '(站队|来辩|不服来|投个票|投票|下注|押注)'
  - '换你(当|来|做|上)'
  - '评论区(见|告诉我|聊聊|说说|走起)'

# 兜底话术模板（生成侧 2 次打回仍缺时，由保存侧按 interaction_type 注入；不编造事实）
兜底模板:
  关注:
    - '关注老六，这波后续我替你盯着。'
    - '点个关注，明天赛后第一时间来复盘。'
    - '关注不迷路，这类事后面还有下文。'
  互动:
    站队式: '这球你怎么看？评论区站个队，我先来。'
    投票式: '你选哪个？评论区投一票，看看大家怎么想。'
    预测式: '你的预测是什么？评论区留下你的答案，等结果打脸。'
    共鸣式: '有没有同感的？评论区聊聊你的看法。'
    挑战式: '不服来辩，评论区说出你的理由。'
    调侃式: '你们说呢？评论区接个梗。'
    '': '你怎么看？评论区聊聊。'
