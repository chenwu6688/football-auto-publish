# 互动引导闸门（R11 内容诊断 2026-10-13「建议5」/ 计划 13.5 / 2026-11-06 合规修正）
#
# ## 2026-11-06 的重大修正（此前方向是反的）
#
# 旧口径：正文必须同时具备「关注引导」+「互动引导」，缺任一类打回重写，
#         最后一轮由保存侧模板**注入**关注话术。实测 11-06 的稿子确实带
#         `interaction_bait_source=template_fallback`——即系统在主动往正文里塞
#         「关注老六，这波后续我替你盯着」。
#
# 而《信用分机制》的扣分表里明写着：
#   诱导交互 20 分 ｜ 违规涨粉 20 分 ｜ 引导互粉 20 分
# 也就是说：**为了让稿子涨粉，系统在批量生产平台明列扣分的话术**。
# 这不是「审得严」，是审错了对象——把增长指标当成了合规要求。
#
# 新口径：
#   1. 「抛出可讨论的问题」保留（平台不罚，且确实有助互动）；
#   2. 「索要关注 / 扣1 / 站队 / 投票 / 回关互粉 / 博彩术语」判违规并拦（见 `诱导话术`）；
#   3. **不再要求**正文必须有「关注引导」，也不再兜底注入关注话术
#      （`关注引导必需: false`）。
#
# 依据：https://baike.toutiao.com/detail/236/470/0 （信用分机制·扣分细则）
#
# 纪律（与全仓一致）：
#   - 正则**必须带引导语境**，否则「值得关注，这事闹大了」这类事实性用词会被误判成钩子；
#   - 配置不可用 → 放行并置 degraded，绝不因读不到配置而阻塞发布（计划九）；
#   - 本文件只描述判据与话术模板，不承载任何素材/事实。

版本: '2.0'
生效日期: '2026-11-06'
口径出处: '信用分机制（诱导交互/违规涨粉/引导互粉 各 20 分）+ 社区规范「平台不鼓励·恶意营销」；R11 内容诊断 2026-10-13 建议5'

# 是否仍把「关注引导」当作成稿必须项。
# 2026-11-06 改 false：索要关注是扣分项（诱导交互/违规涨粉 20 分），不是加分项。
# 想回滚到旧口径（要求必须有关注引导）把它改回 true 即可，代码不用动。
关注引导必需: false

判罚:
  分数: 0
  动作: 打回重写
  提示: '正文不要索要关注（「点个关注」「关注不迷路」「关注我我就回关」都是诱导交互/违规涨粉，扣 20 分），也不要用「扣1」「站队」「投票」「下注」这类话术。想提升互动，就在文末抛一个读者能直接回答的具体问题（如「这球换你当裁判，吹不吹？」）。'

# 条件一：关注引导（**仅用于检测存量，不再作为达标要求**）
关注引导:
  - '(点|加|戳|求|记得|别忘|顺手|不妨)[^。！？!?\n]{0,6}(关注|追更|订阅|收藏)'
  - '(关注|追更|订阅)[^。！？!?\n]{0,10}(不迷路|后续|老六|我)'
  - '不迷路'
  - '(关注|追更|订阅)(一下|我吧|我们|老六)'

# 条件二：互动引导（评论区运营）——只保留「提出可讨论的问题」这一类。
# 2026-11-06 删除：`(抠|扣)1|扣一|扣个1`、`(站队|来辩|不服来|投个票|投票|下注|押注)`
# 这三个模式此前算「达标」，等于奖励诱导交互；`下注|押注` 更是博彩术语（70 分档）。
互动引导:
  - '评论区'
  - '留言'
  - '(说说|聊聊|告诉|发表|亮出)[^。！？!?\n]{0,4}(你的|你|看法|想法|选择|观点)'
  - '(你|您|大家|各位)(觉得|怎么看|认为|选|站)|你们觉得|你怎么看'
  - '换你(当|来|做|上)'
  - '评论区(见|告诉我|聊聊|说说|走起)'

# 条件三（2026-11-06 新增）：诱导话术黑名单 —— 命中即判违规，打回重写。
# 分组只为让打回提示说清楚「哪一类」，判定上都是 hard。
诱导话术:
  索要关注:
    - '(点|加|戳|求|记得|别忘|顺手|不妨)[^。！？!?\n]{0,6}关注'
    - '关注[^。！？!?\n]{0,6}(不迷路|我|老六|我们|本号)'
    - '不迷路'
    - '(求|攒|刷)(个)?(关注|粉丝)'
  互关互粉:
    - '(回关|互关|互粉|关注我我就|你关我我关你)'
    - '(涨粉|增粉)(秘籍|技巧|方法)'
  诱导互动:
    - '(抠|扣)1|扣一|扣个1'
    - '(站队|来辩|不服来|投个票|投票|打个1)'
    - '(点赞|转发|收藏)[^。！？!?\n]{0,4}(一下|抽奖|有礼|送)'
    - '不转不是|转发这条'
  博彩:
    - '(赌球|博彩|下注|押注|庄家|盘口|让球盘|滚球|买球|外围盘|赔率盘)'
    - '(竞彩|体彩|足彩)[^。！？!?\n]{0,4}(推荐|方案|跟单)'

# 兜底话术模板（只在「互动引导」缺失时注入；关注话术自 2026-11-06 起不再自动注入，
# 保留文本仅为存量比对，`inject()` 只在 `关注引导必需: true` 时才会用它）
兜底模板:
  关注:
    - '（已停用：索要关注属诱导交互，2026-11-06 起不再自动注入）'
  互动:
    站队式: '这球你怎么看？说说你的判断。'
    投票式: '两个选择摆在这，你更认哪个？说说你的理由。'
    预测式: '你的预测是什么？说说你的答案。'
    共鸣式: '有没有同感的？说说你的看法。'
    挑战式: '不同意的话，说说你的理由。'
    调侃式: '你们说呢？留言聊聊。'
    '': '你怎么看？'
