# 配比配置（计划 6.3 / 3.5）—— 把策略手册参数化，可版本化，人工仅审批调整
# 由 scripts/ratio_tuner.py 读取并在满足纪律时自动升版；不满足则产出建议交人工确认。
#
# 篇数口径（2026-10-12 对齐）：
#   本文件的「日更篇数 / 时段权重」是**设计口径**，用于人工核对与调参评估；
#   运行时的唯一硬开关是 constants.BATCH_QUOTA（执行见 batch_quota.py），
#   两者数值必须一致，改动时同步修改，否则 verify_batch_quota.py 会报硬项失败。
#   依据：策略手册第五章「供给收缩」（日更 8-11 → 6-8；晨读 2-3 / 午间 2-3 / 晚间 2）
#        与完善计划 12.1（「日更 6 至 8 篇可稳定不断供」）。
生效日期: '2026-10-12'
板块配比:
  转会动态: 25
  人物故事: 25
  中国足球: 20
  战术榜单: 30
日更篇数:
  基准: 6            # 常态：晨读 2 + 午间 2 + 晚间 2（计划 12.1 区间下限 6）
  按星期浮动:        # 周一~周日（1~7）；周四按手册「产能上浮」加发到 8
    1: 6
    2: 6
    3: 6
    4: 8
    5: 6
    6: 6
    7: 6
  浮动上限: 8        # 加发后日合计上限（计划 12.1 区间上限 8）
时段权重:            # 常态 晨读/午间/晚间 = 2/2/2；周四加发后 = 3/3/2（晚间不加发）
  晨读: 0.34
  午间: 0.33
  晚间: 0.33

# 时段窗口（2026-10-12 依 869 条头条真实数据重排；时刻以本块为唯一权威）
#   实测（按小时点击率，样本 ≥15）：
#     08:00 1.05%(n=131)、10:00 1.38%(n=65)、12:00 1.01%(n=170)
#     17:00 0.92%(n=106)、18:00 2.27%(n=30) ← 全时段峰值
#     00:00-05:59 篇均阅读 60.5（全时段最差）；9-10 月 41 条凌晨误发均源于 cron 延迟
#   动作：① 晚间主调度 17:30 → 18:00；② CST 00:00-05:59 设为死区（batch.yml 护栏，一律不发）
#   一致性由 scripts/verify_publish_schedule.py 硬校验（constants / wrangler / worker / batch.yml / 本文件）
时段窗口:
  晨读:
    目标: '08:00'
    容忍: ['06:00', '11:00']
  午间:
    目标: '12:00'
    容忍: ['11:00', '15:00']
  晚间:
    目标: '18:00'
    容忍: ['17:00', '22:00']
  死区: ['00:00', '06:00']     # [起, 止) —— 该区间一律不发布
变更原因: '单批上限回归手册：常态每批 2 篇（日 6 篇），周四或 S 级事件可显式加发到手册上限（晨/午 3、晚 2），周内加发 ≤ 2 次'

# 周内节奏执行说明（与手册第五章「三、周内节奏」的差异留痕）
周内节奏说明: |
  手册给出「周四加码 +50%、周三减产至 4-5 篇、周六减产」，其中周三 4-5 篇低于
  完善计划 12.1 的日更下限 6 篇。计划为本项目唯一验收依据，故此处不采纳「低于 6 篇」
  的减产幅度，周三维持 6 篇；周四的加码通过 batch_quota 加发机制实现（最多到 8 篇）。
  该差异已在变更原因中留痕，待人工复核是否需要在手册侧同步修订。

# 调整纪律（计划 8.1 / 11.5）——四道防呆，调参作业据此执行
调整纪律:
  滚动窗口天数: 14        # 低于此长度不足以覆盖完整发布周期
  最小样本: 30            # 单板块少于 30 篇冻结，产建议交人工确认
  单次调整上限: 10        # 单次变动不超过 10 个百分点
  冷静期天数: 14          # 同一板块 2 周内不重复调整
  死区阈值: 0.20          # 篇均阅读相对基准差异不足 20% 不调整
  探索配额: [0.10, 0.15]  # 固定保留 10%-15% 发布位给当期非最优板块

# 版本历史（每次调整追加一条，保留变更原因，供回溯）
history:
  - 生效日期: '2026-10-12'
    变更前篇数: {基准: 7, 晨读: 0.28, 午间: 0.36, 晚间: 0.36}
    变更后篇数: {基准: 6, 晨读: 0.34, 午间: 0.33, 晚间: 0.33}
    板块配比: {转会动态: 25, 人物故事: 25, 中国足球: 20, 战术榜单: 30}
    变更原因: '对齐策略手册第五章与计划 12.1：日更由 7 压到基准 6（区间 6-8），常态单批 2 篇'
