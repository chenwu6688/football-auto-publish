# 人工赛历（计划 11.4 / 13.2）
#
# 用途：football-data.org 不含国足与中超、未覆盖欧联；API-Football（RapidAPI）
#       因免费额度紧张已暂停接入。国足一年仅十余场，人工维护比接接口更可靠。
#
# 维护方式：在 fixtures 下按日期追加条目即可。字段说明：
#   date        比赛日期 YYYY-MM-DD（北京时间）
#   competition 赛事名（如 世预赛 / 亚洲杯 / 中超 / 欧冠 / 欧联）
#   home        主队中文名（建议使用媒体惯用名，与 config/entity_map.json 一致）
#   away        客队中文名
#   time        开球时间 HH:MM（北京时间，默认 19:35）
#   note        备注（可选，仅作人工参考，不进入生成）
#
# ⚠️ 纪律：这里只登记「已确定」的赛程。未确定的赛事不要预填，
#    否则会生成针对不存在比赛的选题（计划 11.4：赛程只能作话题激活器）。

version: 1
updated_at: "2026-10-10"

# 示例（取消注释并改成真实赛程后生效）：
# fixtures:
#   - date: "2026-11-14"
#     competition: 世预赛
#     home: 中国
#     away: 巴林
#     time: "19:00"
#     note: 国足世预赛主场
fixtures: []
