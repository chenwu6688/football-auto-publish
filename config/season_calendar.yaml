# 一级·确定性供给 — 赛季节点日历（计划 12.1）
#
# 计划 12.1 把供给拆成三层，一级·确定性占 30%，来源四类：
#   赛程 / 转会窗截止日 / 赛季节点 / 开赛倒计时
# 特征：可提前 7 天预生成，无时效风险；出稿要求：提前量产入库。
#
# 赛程类由 scripts/fixture_library.py → data/fixtures/topic_pool.json 承担；
# 本日历承担其余三类「节点事件」，由 deterministic_supply.py 前向预生成入库。
#
# 维护纪律（硬约束）：
#   1. 日期以官方公告为准，人工更新；找不到可靠日期就不写，绝不臆测。
#   2. 每赛季更新一次；过期节点由 expire() 自动回收。
#   3. lead_days：提前多少天进入可发布窗口（默认 7，对齐计划「提前 7 天预生成」）。
#   4. template 里的 {days} 由程序替换为剩余天数；{label} 替换为 label。

season: "2026-27"

nodes:
