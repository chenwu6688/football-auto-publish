  # 金球奖：唯一一次「人物故事合法出场」的节点（2026-10-26 写入）
  # 时间口径：颁奖礼伦敦当地 2026-10-26 20:00（BST）= 北京 10-27 03:00。
  # 故 date 记 10-26、reveal_at 记北京时间的揭晓时刻；publish_by = 10-26，
  # 过了这一天库存自动失效，避免「结果已出还在写谁该拿」（旧闻新发红线）。
  # facts 为人工交叉核对后的事实（新华网/人民网/光明网/雷速/直播吧/百度百科 +
  # The National/ARA），生成侧只允许使用这些；未入 facts 的数字一律不得出现。
  - id: ballon_dor_2026
    type: 赛季节点
    label: 金球奖颁奖礼
    date: "2026-10-26"
    lead_days: 1
    column: 人物故事
    awareness: A
    reveal_at: "2026-10-27 03:00"
    # 结果期：揭晓后 12h 内改发「结果稿」（谁拿了），事实靠 event_result 现场多源取证。
    # 赛前稿（谁该拿）在 reveal_at 后自动失效，不再生成。
    result_window_hours: 12
    result_min_sources: 2
    result_keywords: ["金球奖", "金球", "Ballon d'Or", "Ballon dOr"]
    template: "金球奖要揭晓了，凯恩这份数据和亚马尔的世界杯，评奖更认哪一个"
    fact_source_url: "https://www.thenational.ae/sport/football/2026/10/21/ballon-dor-2026-nominees-favourites-ceremony-date-and-how-to-watch"
    facts:
      - "第 70 届金球奖颁奖礼于 2026 年 10 月 26 日（周一）在伦敦钯剧院（London Palladium）举行，当地时间 20:00 开始，即北京时间 10 月 27 日 03:00；这是该奖历史上首次离开巴黎，移师伦敦是为纪念 1956 年首届得主、英格兰人斯坦利·马修斯。"
      - "当晚由蒂埃里·亨利与英国记者凯特·斯科特（Kate Scott）共同主持。"
      - "男子 30 人候选名单于 9 月 8 日公布；卫冕得主奥斯曼·登贝莱（2025 年从罗德里手中接过奖杯）在列，2024 年得主罗德里与八次得主梅西也在列，C 罗不在名单内。"
      - "哈里·凯恩上赛季为拜仁出战 51 场，打进 61 球、7 次助攻；其中德甲 31 场 36 球，拿下德甲金靴与欧洲金靴（36 球 72 分）；随队夺得德甲、德国杯、德国超级杯三冠。"
      - "凯恩在 2026 世界杯为英格兰出战 7 场打进 6 球，英格兰获得季军。"
      - "拉明·亚马尔随西班牙夺得 2026 世界杯：7 月 19 日决赛加时 1-0 击败阿根廷，费兰·托雷斯第 106 分钟打进制胜球，这是西班牙队史第二座世界杯。"
      - "基利安·姆巴佩上赛季西甲 25 球拿下西甲金靴；2026 世界杯以 10 球获得赛事金靴。"
      - "金球奖投票由 100 个国家的记者各选 10 人排名，对应 15/12/10/8/7/6/5/4/2/1 分；考察期为 2025 年 8 月 3 日至 2026 年 7 月 19 日，选票已于 9 月 28 日截止。"
      - "英格兰球员上次获得金球奖是 2001 年的迈克尔·欧文，此前共有 4 名英格兰球员获奖。"

