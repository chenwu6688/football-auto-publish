# ============================================================
# 选题分类与类别优先级（计划 5.1 / R11 内容诊断）
#
# 数据出处（R11 内容诊断：869 条头条真实导出回测，2026-01-01~10-12）：
#   有效选题 = 转会官宣 CTR 2.08% / 冲突舆情 1.55% / 中国足球 1.36%
#   战报比分式内容占产量 23.9%、CTR 仅 0.49%、0 爆款 → 减产（软上限，不硬禁）
#
# 判定顺序（形态优先于主题，模块 docstring 同款说明）：
#   ① 标题命中「比分模式」或「赛果模式」        → 战报比分
#   ② content_type=="转会资讯" 或命中转会关键词  → 转会官宣
#   ③ 命中冲突关键词                            → 冲突舆情
#   ④ 命中中国足球关键词                        → 中国足球
#   ⑤ 其余                                      → 未分类
#
# 为什么形态优先于主题：一条带比分的「国安3-1大胜」即便主题是中国足球，
#   其点击形态仍是战报比分式（R11 回测中该形态 0 爆款）——先按形态归入战报比分。
# 为什么联赛名不罚：中国足球本身是有效选题（CTR 1.36%），只有「比分/赛果
#   开场形态」才减产；中国足球词表照常命中主题类，不受形态判定连坐。
#
# 词表扩展纪律：新增词条必须有回测数据支撑（遵循调参纪律：最小样本 / 死区
#   阈值 / 单次调整上限 / 冷静期），禁止凭感觉加词——误扩会把有效选题错杀。
# ============================================================

版本: '1.0'
生效日期: '2026-10-13'
口径出处: 'R11 内容诊断（869 条头条真实导出，2026-01-01~10-12）：转会官宣 2.08% / 冲突舆情 1.55% / 中国足球 1.36% / 战报比分 0.49% 且 0 爆款'

# 类别优先级：列表下标即 tier（越小越优先）；未列出的类别排最后
类别优先级: ['转会官宣', '冲突舆情', '中国足球', '未分类', '战报比分']

# 单批软上限：超出即从本批主稿选题移出（进 dropped 留痕），非战报类别永不删
单批软上限: {'战报比分': 1}

# 非阻断监控阈值（超限只告警，不删题）
监控: {'战报比分占比阈值': 0.5, '未分类占比阈值': 0.8}

# 形态词表（只判标题）
比分模式: ['\d+\s*[-:比]\s*\d+']
赛果模式: ['大胜|血洗|绝杀|逆转|爆冷|告负|平局|取胜|击败|战胜|输给|横扫|惨败|小胜|战平|不敌|险胜|逼平|击溃|吊打|完胜|惜败|落败|破门|戴帽|晋级|出线']

# 主题词表（判全字段：title/angle/why_pick/keywords_cn/content_type）
转会关键词: ['官宣', '签约', '加盟', '离队', '续约', '转会', '租借', '买断', '解约', '免签', '转会费', '新帅', '换帅', '下课']
冲突关键词: ['冲突', '争议', '内讧', '炮轰', '怒斥', '互喷', '撕破脸', '质疑', '批评', '道歉', '处罚', '禁赛', '罚单', '种族歧视', '风波', '对峙', '叫板', '喊话', '回怼', '暗讽', '爆料']
中国足球关键词: ['国足', '中国队', '中超', '中甲', '足协杯', '中国足球', '国安', '申花', '海港', '泰山', '蓉城', '三镇', '亚泰', '玉昆', '浙江队']
