# 审核机制分层清单（2026-11-04 重构 · 2026-11-06 按平台规则重排）
#
# 为什么需要这份清单：此前 39 个 `scripts/verify_*.py` 一视同仁地每周一跑一次，
# 结果是**口径类（代码接没接）每周重复，结果类（发没发成/有没有人看）一次没有**，
# 而且 8 个发布前验收里 7 个带 `|| echo`，FAIL 了稿子照样往下走到发布。
# 清单把「什么时候跑」「FAIL 了挡什么」这两件事显式化，并由
# `scripts/verify_audit_health.py` 反过来检查本文档本身有没有失真。
#
# ── 2026-11-06 新增 scope：把「审核」和「体检」分开 ─────────────────────────
# 用户问「审核逻辑能不能精简，唯一目标是遵守头条规则、别被扣分」。盘点结论是：
# 47 项里只有 9 项判的是「会不会被扣分」，其余 38 项判的是质量偏好 / 增长指标 /
# 生产线健康 / 工程接线。四类混用同一套 hard-advisory 语义，是「审核很复杂」的根源。
#
#   scope 的五类（唯一一套分类，由 verify_rule_coverage.py 强制）：
#   compliance  平台扣分风险。**唯一允许进 pre-publish 的一类**。
#               每条必须挂 rule_ids（见 config/toutiao_rules.yaml）。
#   quality     平台「不鼓励」但不扣分，只影响推荐量（标题三要素/配图张数/封面率）。
#   growth      内部增长指标（点击率、涨粉、内容类型配比、差异化）。
#   ops         生产线健康（发出去没有、什么时候发、篇数、额度、采集诊断）。
#   dev         工程接线与元验收（常量自洽、信号排序、清单自身）。
#   meta        验收体系自身（元验收，与内容无关）。
#
#   **为什么必须分开**：pre-publish 混入非合规项 → 生产线抖一下（额度/网络/篇数）
#   就停发，而停发不减少任何扣分风险；反过来，compliance 项散在 code-change/weekly
#   里 → 生成完到发布之间没有任何合规复核。这两件事此前同时存在。
#
# 四层的语义：
#   pre-publish  每批发布前跑。**只允许 scope=compliance**；
#                hard=不通过就**不发这一批**；advisory=只告警，稿子照发。
#   daily        每天 09:10 CST 跑（daily-result.yml）。看「昨天真的发生了什么」，
#                不通过 = 有人今天必须处理，但不回滚已发布的稿。
#   code-change  代码/Prompt/配置变更时跑（口径类：接线、常量自洽、禁用词表）。
#                这类结论只在改代码时才会变，每天重跑纯属浪费。
#   weekly       每周一跑（慢变指标 + 元验收）。
#
# negative 字段：该脚本里**能证明判定真的在判定**的负向用例（把阈值放松/数据弄坏后
# 必须报红）。填 null = 承认没有，计入 debt；debt 只许减少，不许增加（见 meta 段）。
#
# kind 的语义只有一条：**FAIL 时挡不挡本批发布**。
#   hard     = 不通过就不发这一批（合规类 + 少数生产线红线）
#   advisory = 只告警，稿子照发（其余全部）
# 它**不表示**「CI 里会不会红」——每日门禁（daily-result.yml）里的步骤都不带 `|| echo`，
# 红了就是红了，但那不等于要停发；两件事混在一起谈，就会得出「7/8 只告警所以没人管」
# 这种既对又不解决问题的结论。

version: 3
updated: "2026-11-06"

meta:
  # 2026-11-04 盘点：39 项里只有 8 项有真负向用例，其余 31 项「恒真风险」。
  # 这个数字是**实测**得来的，不是估计。硬门禁只要求它不增长——
  # 一次性要求 39/39 会让这条线立刻变红，红久了就会被 `|| echo` 软化（11-03 的坑）。
  # 2026-11-04 夜：batch_mix 补了「目标漂移必红」的负向用例，债务 31 → 30，
  # 基线同降（基线必须等于当前实际债务，否则「元层负向自检」那条会失效）。
  # 2026-11-04 傍晚：新增 gallery_entities 时**自带负向用例**，41 项/11 项有负向
  # → 债务仍是 30，基线不动。基线必须等于当前实际债务，否则「元层负向自检」会失效。
  # 2026-11-04 夜：新增 topic_funnel（S2 前置度量）同样自带负向（内置「改坏源码必须
  # 报红」的负向检查）→ 43 项/13 项有负向，债务仍 30，基线不动。
  # 记账提醒：项数会涨，债务不许涨。**不要为了「项数好看」把没有负向的东西登记进来。**
  baseline_negative_debt: 30
  debt_must_not_grow: true
  # 每日层的最小集合：可以加项，不许悄悄删项（否则「每日结果门禁」会被慢慢掏空）
  required_daily:
    - compliance           # 会不会被扣分（2026-11-06 起：唯一合规入口）
    - publish_success      # 实际发出去没有（在此之前 39 个验收没有一个看这个）
    - cover_coverage       # 无封面率（无封面组 CTR 0.52% vs 2.07%）
    - batch_mix            # 每批结构（热点球评 + 数据型）
    - content_mix          # 内容类型配比（按实际发布口径）
    - publish_gate         # 成稿标题硬违规
    - effect_loop          # 阅读/点击率有没有回升

items:

  # ── pre-publish：每批发布前 ────────────────────────────────────────────────
  # 2026-11-06 收敛：发布前门禁**只允许 scope=compliance** 的项进入，
  # 由 verify_rule_coverage.py 硬性校验。此前 pre-publish 有 10 项，
  # 其中 5 项（篇数/赛程池/额度/差异化/配图张数）与「会不会被扣分」毫无关系，
  # 它们抖动一次就停一批稿，而停发本身不减少任何扣分风险。
  compliance:
    tiers: [pre-publish, daily]
    kind: hard
    scope: compliance
    rule_ids: [TT-01, TT-02, TT-03, TT-04, TT-05, TT-06, TT-07, TT-08, TT-09, TT-10, TT-11, TT-12, TT-13, TT-14]
    why: |
      2026-11-06 立。这是**合规审核的唯一入口**：读 config/toutiao_rules.yaml，
      逐条判定「这篇稿子会不会被头条扣分」，输出「能不能发 + 潜在扣分合计 +
      命中的是第几条规则」。

      为什么要有它：此前 47 个验收脚本、约 402 个判项里混着四类东西
      （扣分风险 / 质量偏好 / 增长指标 / 工程健康），共用同一套硬项-告警项语义。
      结果是真正与合规有关的十几条被埋在 400 条里，发布前 8 个验收有 7 个带
      `|| echo`，拦不住任何东西；同时 5 个与合规无关的项却能在生产线抖动时停发。

      它不重写任何判定逻辑，只按规则表调度现有模块
      （interaction_bait / image_relevance / rumor_wording / fact_assert / data_chart）。

      发布前用 `--fail-on-block-only`：只有真的命中 block 级违规才停发；
      「未判定」不拦（否则正文读不到就会像 11-06 noon 那样整批 0 篇），
      但每日层用裸 rc=2 把「未判定」显式暴露出来。
    negative: "`--selftest` 16 条负向用例：诱导话术/博彩/事实矛盾/重度洗稿/一句话成稿/缺 AI 标识/图不对文/涉时政 必须报红，干净样本必须通过"

  batch_quota:
    tiers: [daily]
    kind: advisory
    scope: ops
    why: |
      原打算做成硬阻断（超发＝违反计划配额），但它内部含「decide 冒烟」等 5 个子项，
      任一抖动就会把当天剩下所有批次全部停掉——收益（少发 1 篇）远小于代价（当天 0 篇）。
      篇数上限在 orchestrator 里由 constants.BATCH_QUOTA 直接约束，这里是事后复算，
      所以只告警。**发布前真正的硬阻断只保留 content_mix 一项**（禁发类型不可撤回）。
    negative: null
  content_mix:
    tiers: [pre-publish, daily]
    kind: hard
    scope: compliance
    rule_ids: [TT-03]
    why: |
      禁发类型（历史回顾）一旦发出去就是违规内容且不可撤回，所以进 pre-publish；
      配额配比又必须每天看（成稿口径会系统性高估弱类型），所以同时进 daily。
    negative: null
  publish_gate:
    tiers: [pre-publish, daily]
    kind: advisory
    scope: compliance
    rule_ids: [TT-02, TT-03, TT-04, TT-05]
    why: |
      硬违规标题必须拦，但**不能阻断发布**：稿子已经生成完，卡在发布前等于白烧额度；
      而且本项有过「连续多年份存量染红」的历史（11-04 修假绿灯后一次暴露 56 条），
      做成硬阻断会把一个验收器的 bug 放大成「全天零发布」。真正的拦截在生成侧
      （score_title_plan），这里是事后复算。
    negative: null
  fixture_pool:
    tiers: [daily]
    kind: advisory
    scope: growth
    why: 赛程池不足时退化到新闻流即可，不影响已生成的稿（计划九）
    negative: null
  api_budget:
    tiers: [daily]
    kind: advisory
    scope: ops
    why: 额度告警与发布解耦（计划 11.4）
    negative: null
  rumor_wording:
    tiers: [pre-publish]
    kind: advisory
    scope: compliance
    rule_ids: [TT-02, TT-04]
    why: 传闻措辞是生成侧闸门的复算，命中即已打回（计划 4.1）
    negative: null
  content_reference:
    tiers: [pre-publish]
    kind: advisory
    scope: compliance
    rule_ids: [TT-06]
    why: 参照层（抄方法论不抄选题，计划 13.3）
    negative: null
  differentiation:
    tiers: [weekly]
    kind: advisory
    scope: growth
    why: 六个差异化方向（计划 13.5）
    negative: null
  article_images:
    tiers: [daily]
    # 2026-11-05 用户把「每篇至少 3 张图」定为**硬条件**，所以从 advisory 升为 hard。
    # 当时实测的生产真实水平是每篇 1 张（11-05 三篇全是 1 张），不是「偶发波动」。
    # 之所以敢升硬：下限已经不再依赖外部图源——7 种版式 × 4 套配色的信息图全部由
    # 本文标题和正文派生，连「正文只有一句话」的稿子都能补满 3 张（有自检兜着），
    # 唯一能失败的是系统中文字体缺失，而那本身就是必须立刻知道的事故。
    kind: hard
    scope: quality
    rule_ids: [TT-09]
    why: |
      用户原话：「硬条件：单篇文章必须至少有三张图」。这一项查三件事：
      ①爬取层/补齐机制是否真的接上（接线断 = 配图量静默跌回 0~1 张）；
      ②生效日之后每批每篇 images ≥ 3；
      ③同一篇的几张信息图不能只是换了个配色（版式必须 ≥2 种）。
      另有一项拿「正文仅一句 / 正文为空 / 多段无小标题」三类极端稿直接跑版式库，
      出不满 3 张即报红——这是「硬条件」能不能兑现的唯一实证。
    negative: "喂一个「生效日后但只有 1 张图」的批次必须报红，同一批 3 张的必须达标（--selftest）"

  publish_states:
    tiers: [code-change]
    # 2026-11-05 夜间立。当晚 0 篇的三种原因（生成崩/预测稿被跳过/上游没产出）
    # 共用一个 exit 1，批次还被标成「已完成」→ 补发被幂等跳过 → 当批永久丢失。
    # 这条验收管的是**契约**而不是数据：退出码语义、库函数不得自行终止进程、
    # 工作流按退出码分流、重拟链不得裸调评分器、预测稿口径只准一处。
    kind: advisory
    scope: ops
    why: |
      它只判定「代码接没接对」，判定结果在改代码时才会变，所以进 code-change。
      FAIL 不阻断发布：这类问题一旦阻断，等于让验收器的 bug 决定今天有没有稿子发。
      真正的止损在运行时：publisher 的三态退出码 + 工作流分流 + 台账 no_publishable。
    negative: "把 EXIT_NOTHING_SKIPPED 改成 1（两态同码）后 A 项必须报红；脚本内置该负向自检"

  hot_freshness:
    tiers: [code-change]
    # 2026-11-06 用户反馈立。两条反馈指向同一个洞：选题供给与「今天大家在谈
    # 什么」完全脱钩 —— 热搜进不了候选（信号只做排序、产生不了新候选），
    # 同一场比赛换个措辞就重复发（英文关键词比中文队名恒不相等）。
    # 这条验收管的是**接线**：热点通道在不在、事件键落不落盘、赛程去重按不按对阵。
    kind: advisory
    scope: compliance
    rule_ids: [TT-03]
    why: |
      与 publish_states 同类：判定的是「代码接没接对」，只有改代码才会变，
      所以进 code-change；FAIL 不阻断发布，否则验收器的 bug 会决定今天有没有稿子。
      运行时真正的止损是 event_key 去重 + 每批上限 HOT_TOPIC_PER_BATCH。
      它同时带一条告警项 E（近 7 天热点稿篇数），用于发现「通道接上了但一直空转」。
    negative: "把 event_key 改回「按命中词集合拼接」后 D 项必须报红（C罗退役 ≠ C罗退出国家队）"

  image_relevance:
    tiers: [pre-publish]
    kind: hard
    scope: compliance
    rule_ids: [TT-09]
    why: |
      2026-11-05 用户指令「要保证图片的相关性，不能偏离文章主题」。
      配图改成「正文事实重绘」后，最大的风险从版权变成了「配错」：图画了正文
      没提的球队或比分，比没图更伤——头条信用分里「配图与内容相关性差」是明列
      扣分项。这一项查 ①保存层真的调用了数据图与闸门、②闸门能拦住缺实体/缺数字
      /串味（国际米兰 vs AC米兰）、③无数据不画假图、④被拒的图不留盘（否则台账
      记 3 张读者看 2 张）、⑤产物里的 anchor 配正文重跑闸门仍通过。
      判 hard：前四项全是确定性判定，不依赖网络，红了就是真坏了。
    negative: "六条闸门用例（放行 2 / 拒绝 4）跑 --selftest，任一条判反即报红"

  # ── daily：每天看「昨天真的发生了什么」 ───────────────────────────────────
  publish_success:
    tiers: [daily]
    kind: hard
    scope: ops
    why: 38 个验收全在审「该不该发」，没有一个看「发出去没有」；11-04 一天失败 1/2 零告警
    negative: null
  cover_coverage:
    tiers: [daily]
    kind: hard
    scope: quality
    rule_ids: [TT-09]
    why: 无封面是最差路径（CTR 0.52% vs 2.07%）
    negative: "把阈值人为放松到 100%，判定必须变成「通过」（D 项）"
  batch_mix:
    tiers: [daily]
    kind: hard
    scope: growth
    why: 每批结构决定单批能不能出爆款（配比是月度口径，管不住单批）
    negative: "把排行榜目标改到 45%，「结构隐含份额 vs 配比目标」硬项必须报红（-28.3pp）；另见 selftest「只有低效类型时不凑数」"
  effect_loop:
    tiers: [daily]
    kind: hard
    scope: growth
    why: 改了 40 多天规则，效果闭环是唯一能证明「改对了」的东西
    negative: null
  growth_loop:
    tiers: [daily]
    kind: advisory
    scope: growth
    why: 转粉/互动引导，慢变量
    negative: null
  perf_ingest:
    tiers: [daily]
    kind: advisory
    scope: ops
    why: 绩效回填自动化（导出→台账），断了会让所有效果类验收变成无源之水
    negative: null
  performance_import:
    tiers: [daily]
    kind: advisory
    scope: ops
    why: 头条后台数据接入（主键唯一性 / 列名最长匹配）
    negative: null
  llm_quota:
    tiers: [daily]
    kind: hard
    scope: ops
    why: 额度账本少记 = 按量扣钱；免费额度用完当天就停摆
    negative: "把某个模型的 pct 改 1 个点，A 项必须变 FAIL（D 项）"
  scraper_diagnostics:
    tiers: [daily]
    kind: advisory
    scope: ops
    why: 「返回空」必须区分「真没数据」与「被拦」（懂球帝 567 事故）
    negative: "台账被篡改（kind 未知/缺字段）时必须报错（D 项）"
  acceptance_metrics:
    tiers: [daily]
    kind: advisory
    scope: meta
    why: 目标 vs 实际（注意：它验的是「目标表与计划一致」，不是「实际值达标」）
    negative: null

  # ── code-change：只在代码/配置/Prompt 变更时跑 ────────────────────────────
  title_elements:
    tiers: [code-change]
    kind: hard
    scope: quality
    why: 三要素口径 + 尺子校准（含 181 条头部样本的单调性判据）
    negative: null
  title_anchor:
    tiers: [code-change]
    kind: hard
    scope: quality
    why: 疑问收尾限额 + 锚点覆盖
    negative: "词表清空后「锚点可识别」必须失败（否则说明判定走的是别的路径）"
  title_positive:
    tiers: [code-change]
    kind: advisory
    scope: quality
    why: 正向规则的采用率趋势
    negative: null
  title_antipattern:
    tiers: [code-change]
    kind: hard
    scope: quality
    why: 赛果播报式硬规则（含「比分+过程」豁免，防止误杀好标题）
    negative: null
  title_templates:
    tiers: [code-change]
    kind: advisory
    scope: quality
    why: 句式多样性
    negative: null
  event_cluster:
    tiers: [code-change]
    kind: advisory
    scope: growth
    why: 单事件多切口
    negative: "把角度表清空必须 FAIL（docstring 已写明）"
  event_result:
    tiers: [code-change]
    kind: advisory
    scope: compliance
    rule_ids: [TT-02]
    why: 揭晓型事件结果稿通道
    negative: "用固定的「揭晓时刻」做负向验证"
  topic_category:
    tiers: [code-change]
    kind: advisory
    scope: growth
    why: 选题分类与类别优先级
    negative: null
  publish_schedule:
    tiers: [code-change]
    kind: advisory
    scope: ops
    why: 发布时段纪律（cron 与死区护栏一致性）
    negative: null
  source_roster:
    tiers: [code-change]
    kind: advisory
    scope: dev
    why: 数据源与信源清单
    negative: null
  season_calendar:
    tiers: [code-change]
    kind: advisory
    scope: dev
    why: 赛季节点可信度（有 facts 必须有 fact_source_url）
    negative: "塞一条无来源的假节点必须被抓到（B 项）"
  fact_layer:
    tiers: [code-change]
    kind: advisory
    scope: compliance
    rule_ids: [TT-02, TT-05]
    why: 事实层与量表
    negative: null
  rank_audit_persistence:
    tiers: [code-change]
    kind: advisory
    scope: dev
    why: L3 打分留证（量表校准的前提）
    negative: "删掉一条记录的某个维度，coverage_ok 必须报缺维（E 项）"
  signal_saturation:
    tiers: [code-change]
    kind: advisory
    scope: dev
    why: 防止「往无区分度信号上写规则」重演
    negative: null
  redfox_pilot:
    tiers: [code-change]
    kind: advisory
    scope: dev
    why: RedFox 试点（CI 无 Key 自动跳过实网探测）
    negative: null
  supply_mix:
    tiers: [code-change]
    kind: advisory
