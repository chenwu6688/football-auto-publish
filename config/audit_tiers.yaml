    negative: null

  # ── weekly：慢变指标 + 元验收 ─────────────────────────────────────────────
  audit_health:
    tiers: [weekly]
    kind: hard
    scope: meta
    why: 元验收——检查这份清单本身有没有失真（漏登记/幽灵项/debt 增长/阻断层被软化）
    negative: "把 baseline_negative_debt 调低 1，债务检查必须 FAIL（F 项，跑在该脚本内部）"
  rule_coverage:
    tiers: [code-change, weekly]
    kind: hard
    scope: meta
    why: |
      元验收的第二个方向：`audit_health` 查「清单与脚本是否对得上」，
      本项查「规则表与判据、门禁是否对得上」——
      ①规则表写的判据名必须有实现（拼错会静默判「未判定」，报告看起来像没违规）；
      ②pre-publish 只许 compliance 项（否则生产线抖动就停发，与扣分无关）；
      ③compliance 项数不反弹（这是「审核复杂度」唯一可量化的指标）；
      ④每条规则都被某个 compliance 项引用（否则它只是文档里的一句话）。
      刻意**不进 pre-publish**：它判的是配置，配置变了才需要重跑。
      让它进发布门禁，就违反了自己定的「pre-publish 只放 compliance」。
    negative: "`--selftest` 6 条：扣分规则只标 warn / 判据名拼错 / 质量项塞进 pre-publish / 合规项数超限 / 规则无人引用，逐一必须报红"
  test_gate:
    tiers: [weekly]
    kind: hard
    scope: meta
    why: 单测是否真的被 CI 挡在合并前（门禁不得软化）——此前 CI 从不调用它
    negative: null
  tuning_discipline:
    tiers: [weekly]
    kind: advisory
    scope: dev
    why: 自动调参纪律与四道防呆
    negative: null
  check_slot:
    tiers: [weekly]
    kind: advisory
    scope: ops
    why: 调度检查口径与告警可信度（10-22/10-23 两次假警）——此前 CI 从不调用它
    negative: null
  ranker_signals:
    tiers: [weekly]
    kind: advisory
    scope: dev
    why: ranker 社媒信号接线——此前 CI 从不调用它
    negative: null
  wiki_media:
    tiers: [code-change, weekly]
    kind: advisory
    scope: compliance
    rule_ids: [TT-01]
    why: 维基共享（Wikimedia Commons）—— 足球领域唯一「免费 + 有真人照 + 可商用 + 有 API」
      的图源。判据不是配图率而是**合规与误配**：只收 CC0/PD/CC BY/CC BY-SA、
      必须有作者（能署名）、≥800×600、文件名/描述/分类命中实体、球员类必须在 football
      分类下。2026-11-04 之前维基配图**完全没有署名**，那是实际的许可违规。
      联网实测项在本机必然 skip（*.wikimedia.org 全超时），返回 2 不算通过。
    negative: "把许可白名单改宽（放行 Fair use）/ 去掉「必须有作者」/ 在 search_images 里
      绕过 _wiki_available() 熔断 / 把 Pixabay 或 DDG 贴回来，A/B/C 三项必红；
      负向单测在 tests/test_wiki_media.py"
  gallery_entities:
    tiers: [code-change, weekly]
    kind: advisory
    scope: quality
    rule_ids: [TT-09]
    why: 图库白名单（Pexels/Pixabay）——英文标签索引收到中文 query 会配出饺子/欧元，
      球员名会配出陌生人，球队召回只有一半能对上（实测 16 队里 6 队为 0）。
      本项守的是「不许配错图」而不是「提高配图率」：白名单外一律不查，走数据卡。
      联网实测项在无 PEXELS_KEY 时 skip（返回 2），不算通过。
    negative: "把某条 accept 置空 / query 写中文 / 白名单文件删掉，check_config 必须报红；
      负向单测在 tests/test_gallery_query.py::TestInvalidConfigIsLoud"
  topic_funnel:
    tiers: [code-change, weekly]
    kind: advisory
    scope: growth
    why: |
      选题漏斗台账（2026-11-04）—— 全仓四套配额（supply_mix 三层 / content_mix 七类 /
      batch_mix 两槽 / topic_category 类别优先级）同时在回答「今天写什么类型」，
      但没有任何记录能回答「这一篇是被哪一层挡掉的」。S2 要把配额收成一套，
      没有这张表就只能凭直觉删闸门（10-25 清僵尸测试的教训）。
      本项**不是闸门**：只验「8 层埋点接没接上」，不设任何阈值，
      不要把它挪进 pre-publish —— 把「不发这批」绑在一个纯观测项上是倒退。
      结果项在台账为空时 skip（返回 2），那是「未判定」，不是「零损失」。
    negative: "把 orchestrator 里任一层 `_funnel(\"<key>\")` 改名/换变量后，
      check_wiring 必须报红（verify 内置负向：check_negative 会真的改源码再验一次，
      两条负向都过才算通过）"
