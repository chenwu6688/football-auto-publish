# 外部接口每日额度台账配置（计划 11.4「赛程源选型与额度管理」）
#
# 计划原文：免费额度按日计，缓存后每日调用量可控在 3 次以内。
# 本文件为「操作者可调」的额度过覆盖；优先级：环境变量 > 本文件 > 代码内置默认。
#   - 全局：环境变量 API_DAILY_CAP
#   - 单源：环境变量 APIB_<源名大写、非字母数字转下划线>，如 APIB_API_FOOTBALL
#
# 默认分配的依据：
#   football-data 免费层单次查询窗口硬上限 10 天，14 天窗口须拆成两块 → 2 次；
#   补源（欧联/中超/亚冠/欧协联）按日轮换一个（见 scripts/fixture_library.SUPPLEMENTS），
#   其余联赛读最近缓存、不消耗额度 → 1 次。
#   合计 3 次/日，正好等于计划 11.4 上限。

daily_total_cap: 3

source_limits:
  football-data: 2      # 14 天窗口 = 两个 ≤10 天请求
  juhe: 1               # 中超中文源（轮换日刷新）
  api-football: 1       # 洲际补源（轮换日刷新；联赛 ID 解析亦计入本额度）
