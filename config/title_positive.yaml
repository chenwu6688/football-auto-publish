# ============================================================
# 标题正向规则（R11 内容诊断结论落地，计划 3.3 / 第十章）
# 版本: 2026-10-13
# 生效日期: 2026-10-12
# 口径出处: R11 内容诊断（头条后台 869 条真实图文回测）
# ============================================================
#
# 本文件只承载「可数据证实的正/负向信号」，全部以加分/减分表达，
# 与 title_antipattern.yaml（赛果播报式「0 分硬打回」）严格区分：
#   - 本模块永远不硬阻塞——配置缺失则降级放行（bonus=0, degraded=True）；
#   - 所有 reasons 以「R11数据:」前缀，便于下游 verify 与硬违规理由分桶。
#
# ---- 各条规则的回测依据 ----
# 悬念词 没想到/原来/竟然/居然/反转：回测点击率 +87%  → 加分 12
#   注：反转同时是 title_antipattern 钩子词表里的冲突/悬念钩子（被冲突维度奖励），
#       此处悬念加分是同一词的「有意叠加」——悬念收益（+87%）已实测包含反转，
#       两个维度的加分都有数据支撑，非口径冲突。
# 最优长度带 [21,30]：回测该区间点击率最优；≤15 字最差  → 加分 10
# 赛事名词 世界杯/决赛/小组赛/淘汰赛/半决赛（且无具体人物/球队）：
#   回测 CTR 0.47%、0 爆款，垫底  → 减分 12
#   设计口径（宁漏勿误杀，对齐 R12 闸门哲学）：
#     只要标题出现「具体的人名 / 具体球队 / has_specific 标志」即豁免减分，
#     避免把「梅西的最后一届世界杯」这类有效标题误杀。
#   联赛名排除说明：中超/英超/西甲/意甲/德甲/法甲 不在赛事名词表——
#     中国足球联赛是有效的本地内容类别，且回测未测得「联赛名作标题核心」会垫底，
#     故只收「世界杯/决赛/小组赛」等大而空的赛事泛指名词（它们才是垫底真凶）。
# 情绪词 炸/崩/泪/狠/绝了：回测点击率 -15%  → 减分 8
#   崩盘豁免：崩盘 已是 plan-3.3 既有冲突词（被冲突维度奖励），故情绪减分在
#     探测标题时先剔除「崩盘」再判定「崩」，避免对同一词既奖又罚。
#
# 调参纪律：分数改动须同步更新 title_positive.py 的 _FALLBACK 与单测/验收脚本，
# 并经 scripts/verify_title_positive.py 校验通过。

版本: "2026-10-13"

生效日期: "2026-10-12"

口径出处: "R11 内容诊断（头条后台 869 条真实图文回测）"

# 悬念词（+87% 点击率）；实测 4 词 + 居然（同义扩展，未破坏方向）
悬念词:
  - "没想到"
  - "原来"
  - "竟然"
  - "居然"
  - "反转"        # 同时也是冲突/悬念钩子词，双维度有意叠加

# 回测最优标题长度区间（字）；≤15 字最差
最优长度带: [21, 30]

# 赛事泛指名词（垫底形态）；联赛名（中超/英超/西甲/意甲/德甲/法甲）刻意不入表
赛事名词:
  - "世界杯"
  - "决赛"
  - "小组赛"
  - "淘汰赛"
  - "半决赛"

# 情绪喊麦词（-15% 点击率）
情绪词:
  - "炸"
  - "崩"          # 含「崩盘」时豁免（冲突维度已奖励崩盘）
  - "泪"
  - "狠"
  - "绝了"

# 加分项
加分:
  悬念: 12
  最优带: 10

# 减分项
减分:
  赛事名词: 12
  情绪词: 8
