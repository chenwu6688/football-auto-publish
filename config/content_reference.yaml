# 内容参照层（计划 13.3「抄方法论，不抄选题」）
#
# 本文件只承载「参照谁 / 不参照谁」的方法论与排除项，供**生成环节注入提示**与**选题层校验**；
# 不参与事实层——参照内容绝不作为素材写入正文（计划 3.2 / 11.3）。
#
# 纪律：参照对象只借方法论（信源规范 / 标题结构 / 时效判断 / 栏目分层），
#       不得搬运其具体选题；排除项由选题层（ranker L1）与生成提示双向拦截。
#       机器匹配一律保守，宁可漏拦不误杀（未命中即放行，交由下游继续判定）。

参照项:              # 应当参照 —— 方法论层面，可注入生成提示
  - key: 信源标注规范
    desc: 标题内携带信源，如「罗马诺：」「天空：」「图片报：」，同时对冲失实表述扣分
    applies_to: title
  - key: 标题信息结构
    desc: 信源 + 动作 + 数字或人名
    applies_to: title
  - key: 话题时效判断
    desc: 判断当下哪个事件正在被讨论（由 L2 热度信号支撑，计划 11.2）
    applies_to: selection
  - key: 栏目化与内容分层
    desc: 固定栏目形态，降低单篇生产成本
    applies_to: composition

排除项:              # 不得参照 —— 选题层面，选题层与生成提示应拦截
  - key: 中下游球队转会细节
    reason: 实体认知门槛超出流量池水位
    # 须同时命中「中下游标记」与「转会词」才算——单有「升班马/保级队」多为强队对决，
    # 不构成「中下游球队转会细节」（宁可漏拦不误杀）。
    match_all:
      - ["中下游", "保级队", "升班马", "降级区", "弱旅", "小球队"]
      - ["转会", "签约", "报价", "引援", "转投", "加盟", "续约", "买断", "租借"]
  - key: 欧战赛前前瞻
    reason: 该题材 78 篇仅 852 阅读，已停发
    match_any: ["前瞻", "赛前分析", "赛前前瞻", "赛事前瞻", "赛前盘点"]
  - key: 二线联赛赛事稿
    reason: 篇均阅读不足 11 次
    match_all:
      - ["中甲", "中乙", "德乙", "意乙", "西乙", "法乙", "英冠", "荷甲", "比甲", "苏超", "土超"]
      - ["战报", "赛果", "赛事稿", "前瞻", "直播", "复盘", "分析", "盘点"]
  - key: 三千字深度长文
    reason: 推荐流中长文拖垮完成率，完成率与阅读量弱负相关
    match_any: ["三千字", "3000字", "深度长文"]
    max_chars: 3000        # 宣称目标字数达到该值即视为深度长文

五家媒体:            # 头部媒体各有侧重，只借方法论，不搬选题
  - {name: 懂球帝, 侧重: 资讯速度, 可取: 信源标注规范}
  - {name: 直播吧, 侧重: 资讯速度, 可取: 信源标注规范}
  - {name: 虎扑, 侧重: 观点讨论, 可取: "「话题 + 争议」的标题结构"}
  - {name: 新浪体育, 侧重: 资讯编排, 可取: 栏目划分}
  - {name: 肆客足球, 侧重: "栏目化深度内容（已基本停运）", 可取: 当年的栏目化深度内容}

风险提示:
  - 懂球帝、直播吧在头条自有账号与矩阵，照搬选题等于正面竞争，并触发平台同质化判定
  - 五家的具体选题一律受 13.1 认知度分级约束，不得直接搬运（本模块只借方法论）
