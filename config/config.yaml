output:
  base_dir: ./output
  date_format: '%Y-%m-%d'
  article_prefix: article
  image_dir: images
llm:
  topic_selector:
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.7
    max_tokens: 4096
  article_generator:
    provider: deepseek
    model: deepseek-v4-pro
    temperature: 0.8
    max_tokens: 8192
data_sources:
  match_api:
    provider: football-data.org
    base_url: https://api.football-data.org/v4
    rate_limit: 10
    leagues:
    - id: 2021
      name: 英超
    - id: 2014
      name: 西甲
    - id: 2019
      name: 意甲
    - id: 2002
      name: 德甲
    - id: 2015
      name: 法甲
    - id: 2001
      name: 欧冠
    - id: 2000
      name: 世界杯
  gzh_trending:
    provider: wechat_public_account
    script: skills/gzh-explosive-content-detector/scripts/fetch_gzh_trends.py
    keyword_groups:
    - 足球
    - 英超,欧冠,转会
    - 梅西,C罗,姆巴佩,哈兰德,内马尔,萨拉赫
    - 足球,冲突,争议,红牌,绝杀,逆转
    - 转会,签约,续约,离队,绯闻,花边,冲突,下课
    - 世界杯,2026世界杯,世界杯揭幕战,世界杯小组赛
    - 世界杯,冷门,黑马,淘汰,出线
  hupu:
    provider: hupu_scraper
    script: hupu_scraper.py
    enabled: true
    timeout_seconds: 300
images:
  min_width: 800
  min_height: 600
  max_size_bytes: 5242880
  min_size_bytes: 51200
  preferred_orientation: landscape
  max_per_article: 5
  required_per_article: 3
  sources:
  - name: wikipedia
    priority: 1
  - name: footyrenders
    priority: 2
  - name: unsplash
    priority: 3
schedule:
  timezone: Asia/Shanghai
  batches:
    morning:
      name: 晨读
      cron: 0 0 * * *
      article_count: 2
      columns:
      - 晨读快讯
      - 话题擂台
    noon:
      name: 午间
      cron: 0 4 * * *
      article_count: 2
      columns:
      - 午间快讯
      - 热点速评
    evening:
      name: 晚间
      cron: 30 9 * * *
      article_count: 2
      columns: dynamic
      column_pool:
      - 世界杯日报
      - 老六辣评
      - 争议裁判室
      - 转会雷达
      - 球迷众生相
season_weights:
- months:
  - 8
  - 9
  weights:
    热点球评: 1.0
    转会资讯: 2.0
    排行榜: 1.0
    八卦趣事: 1.2
    战术解析: 0.8
  label: 夏季转会窗
- months:
  - 3
  - 4
  - 5
  weights:
    热点球评: 2.0
    转会资讯: 0.8
    排行榜: 1.2
    八卦趣事: 0.8
    战术解析: 1.5
  label: 赛季争冠冲刺期
- months:
  - 6
  - 7
  weights:
    热点球评: 2.5
    转会资讯: 0.8
    排行榜: 1.0
    八卦趣事: 1.0
    战术解析: 2.0
  label: 世界杯月
- months:
  - 1
  weights:
    热点球评: 1.0
    转会资讯: 2.0
    排行榜: 1.0
    八卦趣事: 1.2
    战术解析: 0.8
  label: 冬季转会窗
- months:
  - 2
  - 10
  - 11
  - 12
  weights:
    热点球评: 1.0
    转会资讯: 1.0
    排行榜: 1.0
    八卦趣事: 1.0
    战术解析: 1.0
  label: 常规赛季
