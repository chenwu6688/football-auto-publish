# 条件三：悬念 / 评价 / 叙事钩子（含任一 → 判定「有钩子」，放行不拦）
#   同样宁多勿少：这些词只要出现，标题就不是「干播报」，不该被拦。
钩子模式:
  - '没想到|原来|竟然|居然|反转|翻车|沉默|破防|凭什么|凭啥|为什么|为何|到底|究竟|别被|其实|真相|背后|说了句|一句话|大实话|该不该|能不能|值不值|怎么|如何|谁'
  - '地狱|天堂|白忙|藏着|余地|天理|却|剧本|玄机|五味杂陈|血压|看不懂|离谱|邪门|倔强|想起|当年|那一年|如今|惨案|首秀|退役|告别|回归|火药味|抢戏|封神|狂欢|添堵'
  - '受不了|争议|难咽|够味|杀疯|掉价|找不着北|直起腰|想骂街|扒底裤|遮羞布|耳光|白给|活该|笑死|无语|服气|任人宰割'
  - '[?？]'

# ============================================================
# 规则二：纯赛事名词式（R11 内容诊断 2026-10-13；建议4「加分升级为打回」）
#
# 由来：`title_positive` 对「赛事泛指名词作标题核心」只做「减分 12」——但
#   `score_title_plan` 及格线 60，**不扣也及格**，实测采用率 0%，即「加分/减分」是
#   无效约束。R11 已证明该形态是最稳定的垫底形态（0.47%、0 爆款），故升级为与
#   「赛果播报式」同级的**硬打回**（机制同规则一，只是覆盖更宽）。
#
# 回测证据（2026-10-13，头条导出 827 条去重真实标题，零误杀校验）：
#   本规则命中 19 条（2.3%）——最高阅读 60、百阅读 0 条、千阅读 0 条
#   → 命中组零百阅读，判硬违规不会误伤任何已验证的有效作品。
#
# 口径（三条件**同时**成立才拦，宁漏勿误杀）：
#   1. 赛事泛指名词出现在标题**起首**（位置 ≤ 开场窗口）；
#   2. 全文无具体人物名、无具体球队名（entity_map club 译名/别名 ∪ 本节 球队名）；
#   3. 无任何悬念/评价/叙事钩子（复用规则一钩子词表 ∪ 疑问号）。
#   联赛名（中超/英超/西甲/意甲/德甲/法甲）刻意不入表——中国足球联赛是有效本地类别，
#   与 title_positive 的口径一致。
#
# 调参纪律：改动须同步 title_antipattern.py 的 _FALLBACK 与
#   scripts/verify_title_antipattern.py 的回归样例，并重跑真实回测确认零百阅读。
规则二:
  规则名: 纯赛事名词式
  判罚:
    分数: 0
    动作: 打回重写
    提示: '标题不要以「世界杯/决赛/小组赛」这类赛事泛指名词打头。请把「谁」提到最前面——用「具体的人（球员/教练）+ 冲突或反差 + 悬念」替换；赛事名词留给正文。'
  开场窗口: 4
  赛事名词:
    - '世界杯'
    - '欧洲杯'
    - '美洲杯'
    - '亚洲杯'
    - '世预赛'
    - '欧冠'
    - '欧联'
    - '欧协联'
    - '小组赛'
    - '淘汰赛'
    - '半决赛'
    - '决赛'
    - '揭幕战'
  球队名: []          # 运行时并入 config/entity_map.json 的 club 译名与别名
