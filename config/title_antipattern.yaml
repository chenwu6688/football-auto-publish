# 标题反模式闸门（完善计划 3.3「标题公式」/ 第十章「内容质量」）
#
# 由来：2026-10-12 用头条后台 869 条真实图文做回测，发现「把比分/赛果当标题核心」
# 是最大的亏损形态，故立此硬规则，把标题质量从"人工事后追责"变成"生成时打回"。
#
# 回测证据（头条真实导出，2026-01-01 ~ 2026-10-12，有效样本 800 条）：
#   含比分的标题          173 条（21.6%）  中位阅读 2  点击率 0.46%  0 爆款
#   比分/赛果开头         130 条（16.2%）  中位阅读 3  点击率 0.49%  0 爆款
#   本规则命中（三条件）    45 条（ 5.6%）  中位阅读 2  点击率 0.48%  0 爆款、0 条百阅读、最高 67
#   全体基线              800 条（100%）   中位阅读 4  点击率 1.04%  19 爆款、83 条百阅读
#   → 命中组既零爆款、又无一条达到百阅读，判为硬违规不会误伤任何已验证的有效作品。
#
# 注意：本表只描述"规则数据"，不写判罚阈值以外的业务逻辑；判罚与执行见 title_antipattern.py。

版本: '1.0'
生效日期: '2026-10-12'
口径出处: '完善计划 3.3（标题公式：具体的人 + 冲突/反差 + 悬念）＋ 第十章内容质量；策略手册第三章'
规则名: 赛果播报式

判罚:
  分数: 0            # 硬违规，与「传闻当官宣」「禁用模板前缀」同级
  动作: 打回重写
  提示: '标题不要以比分/赛果开场。请把「谁」提到最前面，用「人物 + 冲突/反差 + 悬念」替换比分播报；比分留给正文，标题只承担勾人点进来的职责。'

# 「开场」窗口：赛果/比分信号的起始位置 ≤ 该值才算「开场就用比分」（0 基）
开场窗口: 4

# 条件一：赛果/比分信号
比分模式:
  - '\d+\s*[-:比]\s*\d+'
赛果模式:
  - '大胜|血洗|绝杀|逆转|爆冷|告负|平局|取胜|击败|战胜|输给|横扫|惨败|小胜|战平|不敌|险胜|逼平|击溃|吊打|完胜|惜败|落败|破门|戴帽|晋级|出线'

# 条件二：具体人物名（含任一 → 判定「有具体的人」，放行不拦）
#   运行时自动并入 config/entity_map.json 的球员中文名与别名（build_player_map.py 维护）。
#   此表为「兜底 + 知名人物」：entity_map 只覆盖五大联赛进球榜球员，
#   梅西/C罗/孙兴慜/武磊 等知名人物与本土人物均不在其中，故必须在此补齐。
#   宁可多、不可少——多列一个名字只是少拦一条，漏列一个名字会误杀真实作品。
