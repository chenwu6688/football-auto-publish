name: 一次性诊断（回写批次失败日志）

# 用途：匿名拿不到 Actions 日志（API 403 / artifact 401）。
# 让 CI 自己用 github.token 取 logs 端点的 Location 再 curl，把尾部写进
# data/audit 并 push 回来，本地 fetch 读取。**用完即删**。

on:
  push:
    paths:
      - '.github/workflows/_diag_log.yml'

permissions:
  contents: write
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取失败步骤日志尾部
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ vars.DIAG_RUN_ID }}
        run: |
          set -e
          RUN_ID="${RUN_ID:-42007122553}"
          echo "RUN_ID=$RUN_ID"
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs")
          echo "LOC=$LOC"
          if [ -z "$LOC" ]; then echo "拿不到日志地址"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$LOC" -o /tmp/logs.zip
          ls -la /tmp/logs.zip
          mkdir -p /tmp/logs && cd /tmp/logs && unzip -o -q /tmp/logs.zip
          echo "=== 日志文件 ==="
          ls | head -40
          # 生成步骤的日志文件（名称含「生成文章」）；找不到就把全部拼起来
          FILE=$(ls | grep -i '生成文章' | head -1 || true)
          if [ -z "$FILE" ]; then FILE=$(ls | head -1); fi
          echo "FILE=$FILE"
          : > /tmp/out.txt
          {
            echo "===== $FILE ====="
            tail -c 60000 "/tmp/logs/$FILE" || true
            echo
            echo "===== 全量日志中的 Traceback / Error 片段 ====="
            grep -rnE 'Traceback|NameError|ImportError|AttributeError|KeyError|TypeError|ValueError|exit code' /tmp/logs/ 2>/dev/null | tail -60 || true
          } > /tmp/out.txt
          wc -c /tmp/out.txt
          mkdir -p "$GITHUB_WORKSPACE/data/audit"
          cp /tmp/out.txt "$GITHUB_WORKSPACE/data/audit/batch_fail_tail.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "diag-bot"
          git config user.email "diag@users.noreply.github.com"
          git add -f data/audit/batch_fail_tail.txt
          git commit -m "chore(diag): 批次生成失败日志尾部（用完即删）" || echo "无变化"
          git push origin HEAD:main || echo "push 失败"
