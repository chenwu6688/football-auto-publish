name: 一次性诊断（回写批次失败日志）

# 用途：匿名拿不到 Actions 日志（API 403 / artifact 401）。
# 让 CI 自己用 github.token 取 logs 端点的 Location 再 curl，把尾部写进
# data/audit 并 push 回来，本地 fetch 读取。**用完即删**。
#
# 2026-11-05 19:35 这次要两段：18 生成文章（'int' object has no attribute 'get' 栈帧）
# 与 30 发布到头条号（0 秒即失败的原因）。

on:
  push:
    paths:
      - '.github/workflows/_diag_log.yml'

permissions:
  contents: write
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取失败步骤日志
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '42018772288'
        run: |
          set -e
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs")
          echo "LOC=$LOC"
          if [ -z "$LOC" ]; then echo "拿不到日志地址"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" "$LOC" -o /tmp/logs.zip
          ls -la /tmp/logs.zip
          mkdir -p /tmp/logs && cd /tmp/logs && unzip -o -q /tmp/logs.zip
          echo "=== 日志文件 ==="
          ls -la
          : > /tmp/out.txt
          for KEY in 生成文章 发布到头条号; do
            FILE=$(ls | grep -i "$KEY" | head -1 || true)
            echo "### KEY=$KEY FILE=$FILE" >> /tmp/out.txt
            if [ -n "$FILE" ]; then
              echo "===== $FILE =====" >> /tmp/out.txt
              tail -c 30000 "/tmp/logs/$FILE" >> /tmp/out.txt || true
            fi
            echo >> /tmp/out.txt
          done
          {
            echo "===== 全量日志中的 Traceback / AttributeError 片段 ====="
            grep -rnE 'Traceback|AttributeError|NameError|Error:|exit code' /tmp/logs/ 2>/dev/null | tail -80 || true
            echo
            echo "===== 生成文章步骤里 int/topic 相关行 ====="
            grep -rnE "'int' object|topic|改写异常|失败" /tmp/logs/*生成文章* 2>/dev/null | tail -40 || true
          } >> /tmp/out.txt
          wc -c /tmp/out.txt
          mkdir -p "$GITHUB_WORKSPACE/data/audit"
          cp /tmp/out.txt "$GITHUB_WORKSPACE/data/audit/batch_fail_tail.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "diag-bot"
          git config user.email "diag@users.noreply.github.com"
          git add -f data/audit/batch_fail_tail.txt
          git commit -m "chore(diag): 批次失败日志（生成+发布两段，用完即删）" || echo "无变化"
          git push origin HEAD:main || echo "push 失败"
