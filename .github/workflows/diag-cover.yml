name: 诊断-配图卡片与日志（一次性）

on:
  push:
    paths:
      - '.github/workflows/diag-cover.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: pip install pillow pyyaml requests beautifulsoup4

      - name: 字体与卡片渲染实测
        run: |
          echo "== python =="; python -V
          echo "== 中文字体 =="; fc-list :lang=zh | head -5 || true
          python - <<'PY'
          from pathlib import Path
          import cover_card
          out = Path("data/audit"); out.mkdir(parents=True, exist_ok=True)
          titles = [
              "当年那个追风少年如今发福谢顶，你的青春还能找回吗？",
              "老六心中的历史射手榜：巴蒂C罗领跑，谁才是你眼中的最强？",
          ]
          for i, t in enumerate(titles, 1):
              p = cover_card.render({"title": t}, out_dir=out, filename=f"cover_ci_sample-{i}.jpg")
              print("rendered:", p)
          # 探针：卡片里中文是否真被画出来（黑底上白字像素占比）
          from PIL import Image
          for i in (1, 2):
              f = out / f"cover_ci_sample-{i}.jpg"
              if not f.exists():
                  print(f"sample{i} MISSING"); continue
              im = Image.open(f).convert("L")
              px = list(im.getdata())
              light = sum(1 for v in px if v > 140) / len(px)
              print(f"sample{i}: {im.size} 亮像素占比={light:.4f}")
          PY

      - name: 抓 noon 批次日志里的配图段
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          JOB=127040219402
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB}/logs"
          curl -sS -D hdr.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}" || true
          URL=$(awk 'tolower($1)=="location:" {print $2}' hdr.txt | tr -d '\r' | tail -1)
          [ -n "$URL" ] && curl -sSL "$URL" -o raw.log || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path("raw.log")
          if not p.exists():
              Path("data/audit/diag_cover.txt").write_text("NO LOG")
          else:
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              keys = ("配图", "封面", "数据卡", "图片", "Commons", "维基", "wikimedia",
                      "news_source", "gallery", "Pexels", "Unsplash", "上传", "🖼", "📷", "📸")
              keep = [ln for ln in lines if any(k in ln for k in keys)]
              Path("data/audit/diag_cover.txt").write_text(
                  f"total {len(lines)} lines, kept {len(keep)}\n" + "\n".join(keep),
                  encoding="utf-8")
              print(f"{len(lines)} -> {len(keep)}")
          PY

      - name: 回写
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/audit/diag_cover.txt data/audit/cover_ci_sample-*.jpg || true
          git diff --cached --quiet || git commit -m "chore(diag): 配图卡片渲染实测与 noon 配图日志"
          git push || true
