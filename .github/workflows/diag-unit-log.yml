name: 诊断-抓取单测失败日志（一次性）

on:
  push:
    paths:
      - '.github/workflows/diag-unit-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓日志并截取失败尾部
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          JOB=127014542849
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB}/logs"
          curl -sS -D hdr.txt -o /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}" || true
          URL=$(awk 'tolower($1)=="location:" {print $2}' hdr.txt | tr -d '\r' | tail -1)
          echo "location: ${URL:0:80}"
          [ -n "$URL" ] && curl -sSL "$URL" -o raw.log || true
          mkdir -p data/audit
          python3 - <<'PY'
          from pathlib import Path
          p = Path("raw.log")
          if not p.exists():
              Path("data/audit/diag_unit.txt").write_text("NO LOG FETCHED")
          else:
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              # pytest 失败摘要 + 最后 120 行，足够看清 FAILED/ERROR
              keep = [ln for ln in lines if any(k in ln for k in
                      ("FAILED", "ERROR", "Traceback", "short test summary",
                       "ModuleNotFoundError", "ImportError", "assert", "Error:"))]
              tail = lines[-120:]
              out = list(dict.fromkeys(keep + tail))
              Path("data/audit/diag_unit.txt").write_text("\n".join(out), encoding="utf-8")
              print(f"{len(lines)} lines -> {len(out)} kept")
          PY
      - name: 回写
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/audit/diag_unit.txt || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(diag): 回写单测失败日志"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main || true
            sleep $((attempt * 2))
          done
