name: Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 0-12,22,23 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
      contents: read
    steps:
      - name: 轮询检查
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          CST_HOUR=$(TZ=Asia/Shanghai date +%H)
          CST_MIN=$(TZ=Asia/Shanghai date +%M)
          echo "Current: ${CST_HOUR}:${CST_MIN} CST"

          BATCH=""
          if [ "$CST_HOUR" = "08" ] && [ "$CST_MIN" -ge "0" ] && [ "$CST_MIN" -lt "10" ]; then
            BATCH="morning"
          elif [ "$CST_HOUR" = "12" ] && [ "$CST_MIN" -ge "0" ] && [ "$CST_MIN" -lt "10" ]; then
            BATCH="noon"
          elif [ "$CST_HOUR" = "17" ] && [ "$CST_MIN" -ge "30" ] && [ "$CST_MIN" -lt "40" ]; then
            BATCH="evening"
          fi

          if [ -z "$BATCH" ]; then
            echo "Not a batch window, exiting"
            exit 0
          fi

          echo "Batch window: ${BATCH}"
          gh workflow run batch.yml --ref main -f batch="$BATCH"
          echo "Triggered batch.yml for ${BATCH}"
