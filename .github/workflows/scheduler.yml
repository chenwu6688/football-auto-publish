name: Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 0-12,22,23 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: write
      contents: read
    steps:
      - name: 轮询检查并触发到点批次
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          CST_HOUR=$(TZ=Asia/Shanghai date +%H)
          CST_MIN=$(TZ=Asia/Shanghai date +%M)
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)

          BATCH=""
          if [ "$CST_HOUR" = "08" ] && [ "$CST_MIN" -ge "0" ] && [ "$CST_MIN" -lt "10" ]; then
            BATCH="morning"
          elif [ "$CST_HOUR" = "12" ] && [ "$CST_MIN" -ge "0" ] && [ "$CST_MIN" -lt "10" ]; then
            BATCH="noon"
          elif [ "$CST_HOUR" = "17" ] && [ "$CST_MIN" -ge "30" ] && [ "$CST_MIN" -lt "40" ]; then
            BATCH="evening"
          fi

          if [ -z "$BATCH" ]; then
            echo "🕐 ${CST_HOUR}:${CST_MIN} - not a batch window"
            exit 0
          fi

          echo "🎯 ${CST_HOUR}:${CST_MIN} - ${BATCH} batch window"

          # Check if batch already completed via metadata.json API
          META_API="repos/$GH_REPO/contents/output/${TODAY}/metadata.json?ref=main"
          COMPLETED=$(gh api "$META_API" --jq '.content | @base64d | fromjson | .batches_completed | join(",")' 2>/dev/null) || true

          if echo "$COMPLETED" | grep -q "$BATCH"; then
            echo "⏭️  ${BATCH} batch already completed today"
            exit 0
          fi

          echo "🚀 Triggering batch.yml for ${BATCH}..."
          gh workflow run batch.yml --ref main -f batch="$BATCH"
          echo "✅ batch.yml triggered for ${BATCH}"
