name: 调度健康检查
# cron reactivation after repo went public 2026-06-11

# 午检（12:37 CST，实际可能延迟）：仅检查晨读(morning)是否完成；
#   另做「周一校准推送值守」——核对今日 calibration-reminder 是否真的被触发
#   （2026-10-19 GitHub 整次丢弃 schedule 触发，见 scripts/check_calibration_push.py）
# 终检（22:17 CST）：检查全部三个批次(morning/noon/evening)是否完成
# 如有遗漏，通过 WxPusher 发送告警
#
# 目标日期/时段必须按「触发它的 cron」算，不能按运行时刻算：
#   GitHub 定时任务每天稳定延迟 4~5 小时，22:17 的终检常常次日 02:3x 才跑，
#   12:37 的午检常常 17:3x 才跑。按运行时刻算会报「今天晨读全部缺失」
#   （其实今天还没开始）和「evening 缺失」（其实是午检）。见
#   scripts/resolve_check_slot.py（2026-10-23 假警事故）。
on:
  schedule:
    - cron: '17 14 * * *'  # 22:17 CST — 终检，检查全部三个批次（offset to avoid stampede）
    - cron: '37 4 * * *'  # 12:37 CST — 午检，仅检查晨读是否完成，未完成则告警
  workflow_dispatch:

permissions:
  contents: read   # actions/checkout 拉代码
  actions: read    # 读取校准提醒工作流的运行记录（值守用）

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 爬虫健康检查
        id: scraper_health
        continue-on-error: true
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          echo "🔍 爬虫健康检测..."
          python3 scripts/health_check_scraper.py --alert
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: 解析本次调度对应的目标日期（防延迟跨日假警）
        id: slot
        run: |
          # 2026-10-23 事故：22:17 的终检被 GitHub 拖到次日 02:33 才跑，旧逻辑拿
          # 「运行日」当今天 → 报「2026-10-23 晨读全部缺失」，而晨读 07:00 才开始。
          # 12:37 的午检拖到 17:3x 时又会被判成终检 → 误报 evening 缺失。
          # 现在按「触发它的 cron」反推应触发时刻（scripts/resolve_check_slot.py）。
          SLOT=$(python3 scripts/resolve_check_slot.py --schedule '${{ github.event.schedule }}')
          TARGET=${SLOT%% *}
          PERIOD=${SLOT##* }
          if [ "$PERIOD" = "midday" ]; then
            EXPECT="morning"
          else
            EXPECT="morning noon evening"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "period=$PERIOD" >> $GITHUB_OUTPUT
          echo "expect=$EXPECT" >> $GITHUB_OUTPUT
          echo "📅 本次调度对应: ${TARGET}（时段 ${PERIOD}，应完成: ${EXPECT}）"

      - name: 周一校准推送值守（防 GitHub 丢调度）
        if: steps.slot.outputs.period == 'midday'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          # 仅周一实际检查；非周一脚本自行跳过。已触发（含 queued/in_progress）不告警，
          # 只在一整天都没有任何运行记录时提醒手动补跑。
          python3 scripts/check_calibration_push.py

      - name: 检查批次完成情况
        id: check
        run: |
          TODAY="${{ steps.slot.outputs.target }}"
          META="output/${TODAY}/metadata.json"
          EXPECTED="${{ steps.slot.outputs.expect }}"
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "expect=$EXPECTED" >> $GITHUB_OUTPUT

          echo "📋 调度健康检查 — ${TODAY}（时段: ${{ steps.slot.outputs.period }}，应完成: ${EXPECTED}）"
          echo ""

          if [ ! -f "$META" ]; then
            echo "❌ ${TODAY} 无任何批次记录"
            echo "status=all_missing" >> $GITHUB_OUTPUT
            exit 0
          fi

          MISSING=$(EXPECTED="$EXPECTED" TODAY="$TODAY" python3 scripts/check_missing_batches.py)
          echo "missing=$MISSING" >> $GITHUB_OUTPUT

          if [ -z "$MISSING" ]; then
            echo "✅ 应完成的批次均已就绪: $EXPECTED"
            echo "status=all_ok" >> $GITHUB_OUTPUT
          else
            echo "⚠️  缺失批次: $MISSING"
            echo "status=partial" >> $GITHUB_OUTPUT
          fi

          # Show what was published today
          echo ""
          echo "今日已发文章:"
          python3 scripts/list_today_articles.py "$TODAY" 2>/dev/null || true

      - name: 发送告警
        if: steps.check.outputs.status != 'all_ok'
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          TODAY="${{ steps.check.outputs.today }}"
          STATUS="${{ steps.check.outputs.status }}"
          MISSING="${{ steps.check.outputs.missing }}"
          PERIOD="${{ steps.slot.outputs.period }}"
          EXPECTED="${{ steps.check.outputs.expect }}"

          # 日期可能不是今天（GitHub 延迟跨日时的终检查的是前一天），
          # 所以文案里不再写「今日」，直接给目标日期
          if [ "$STATUS" = "all_missing" ]; then
            TITLE="🚨 调度告警"
            BODY="${TODAY} 应完成批次（${EXPECTED}）全部缺失！请检查 GitHub Actions 状态。"
          elif [ "$PERIOD" = "midday" ]; then
            TITLE="⚠️ 午检告警"
            BODY="${TODAY} 晨读批次可能未完成（缺失: ${MISSING}）。请检查 GitHub Actions，必要时手动触发 workflow_dispatch。"
          else
            TITLE="⚠️ 调度告警"
            BODY="${TODAY} 缺失批次: ${MISSING}（应完成: ${EXPECTED}），已完成批次不受影响，请检查 GitHub Actions。"
          fi

          python3 scripts/send_wxpusher.py "$WXPUSHER_APPTOKEN" "$WXPUSHER_UID" "$TITLE" "$BODY"
