name: 单元测试

# 为什么需要这个工作流
# ------------------------------------------------------------------
# 仓库原有 CI 门禁只有 scripts/verify_*.py（契约/产物/调度验收），
# **没有任何 pytest 步骤**。后果是 tests/ 下 22 项失败长期无人知晓：
# 每次改代码只能靠人工比对「失败数量和上次一样吗、按文件分布一样吗」
# 来判断有没有引入回归——这种判断方式极不可靠，真回归很容易混在
# 「已知的 22 项」里被放过。
#
# 2026-10-25 清理时查明：那 22 项全是 90a9b29「彻底简化架构，只保留
# Pipeline A」留下的僵尸测试（测已删除的函数、已搬走的常量、已改写的
# prompt），不是功能缺失。清理后全量 1021 passed / 0 failed。
# 现在把它们变成硬门禁：红了就别合。

on:
  push:
    branches: [main]
    # 只跑代码变更。CI 每天回写 data/output/audit 的 chore 提交不该触发
    # 单测，否则一天几十次运行全是噪音。
    paths:
      - '**.py'
      - 'tests/**'
      - 'config/**'
      - 'prompts/**'
      # 2026-11-05 补：此前改 batch.yml 完全不触发任何 CI。
      # 那天「choices 没给 default → 补发跑成空批次还报成功」就是零信号改出来的，
      # 而 scripts/verify_publish_states.py 恰恰要用 AST/YAML 校验这些文件。
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest（全量单测）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 2026-11-05：别再手写包清单。此前这里漏了 beautifulsoup4，
          # 而 media_scraper.py 顶层就 import bs4 → tests/test_scraper_diagnostics.py
          # 收集期 ModuleNotFoundError，pytest exit 2，CI 从 11-03 起一直红。
          # 红灯被当成「已知噪音」，结果 11-04 的 3.12-only f-string 语法错误
          # 就这么混进了 main。直接吃 requirements.txt，生产装什么单测装什么。
          # playwright 只需可 import（相关用例全部 mock 掉浏览器），不装 chromium 二进制。
          pip install -r requirements.txt pytest
          # 中文字体：cover_card 的渲染用例要求真能画出汉字。CI 镜像缺 CJK 字体时
          # render() 会按新契约返回 None（宁可不出图也不出版方框图），用例会红——
          # 那正是我们想要的行为，所以这里必须给环境补上字体，而不是放宽断言。
          if ! sudo apt-get update -qq; then
            echo "::warning::apt-get update 失败，尝试直接安装字体"
          fi
          if ! sudo apt-get install -y -qq fonts-noto-cjk; then
            echo "::warning::fonts-noto-cjk 安装失败：数据卡渲染色例会因缺字体而失败"
          fi
          # ffmpeg：tests/test_video_pipeline.py 里有真跑 ffmpeg 合成 mp4 的端到端用例
          # （edit_with_broll / compose / 字幕烧录）。2026-11-11 起该文件纳入全量，
          # 镜像若缺 ffmpeg，这些用例会以 CalledProcessError 失败。
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! sudo apt-get install -y -qq ffmpeg; then
              echo "::error::ffmpeg 缺失且安装失败：video_pipeline 端到端用例无法运行"
              exit 1
            fi
          fi
          ffmpeg -version | head -1

      - name: 跑全量单测
        # 2026-11-11：取消 --ignore=tests/test_video_pipeline.py。此前排除它的理由
        # 是「缺 edge_tts/ffmpeg 的可选重依赖」，代价是这个文件里的 5 个用例
        # 一个版本都没跑过，而它们当时已经坏了（硬编码 libopenh264）。
        # 「不在主链路」不等于「可以坏着」—— 坏着没人知道，才是真正的风险。
        # 依赖：edge-tts 已进 requirements.txt；ffmpeg 由上一步保证。
        run: |
          python -m pytest tests/ -q -p no:cacheprovider

      - name: 失败摘要（便于在 Actions 页面直接看清）
        if: failure()
        run: |
          echo "::error::单元测试失败。请在本地复跑："
          echo "::error::PYTHONPATH=. python -m pytest tests/ -q"

  # 2026-11-04 事故：title_elements.py 用了 Python 3.12 才允许的 PEP 701 f-string
  # （表达式内复用引号且跨行）。本机 3.12/3.13 全绿、单测 job 也是 3.12，
  # 但批次 job 是 3.11 → `import title_elements` 在导入期 SyntaxError，
  # 「生成文章」步骤 1 秒崩，连漏斗台账都来不及落盘，连挂 evening/morning 两批。
  # 单靠 ast.parse(feature_version=(3,11)) 抓不住（f-string 分词不受它管），
  # 唯一可靠办法是用**真的 3.11 解释器**编译全仓。这个 job 不装任何依赖，几秒跑完。
  py311-compat:
    name: py3.11 全仓编译（与批次同版本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 编译所有 .py（硬门禁，不加 || echo）
        run: |
          if ! python -m compileall -q .; then
            echo "::error::存在 Python 3.11 无法编译的 .py。常见成因：3.12 PEP 701 f-string（表达式内复用引号/跨行）。本机 3.12 能过不代表 CI 能过。"
            exit 1
          fi
          echo "✅ 全仓在 Python 3.11 下编译通过"
