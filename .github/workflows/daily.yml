name: 足球自媒体每日发布（手动/外部触发）

# cron-job.org 已弃用，日常调度由 batch.yml 原生 GitHub cron 负责
# 此 workflow 仅保留 workflow_dispatch 供手动触发和紧急补发
on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次选择'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon
          - evening

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 解码头条号登录状态
        run: |
          if [ -n "$TOUTIAO_AUTH_B64" ]; then
            echo "$TOUTIAO_AUTH_B64" | base64 -d | gunzip > toutiao_auth.json
            echo "头条号登录状态已恢复"
          else
            echo "⚠️ 未设置 TOUTIAO_AUTH_B64，将跳过发布步骤"
          fi
        env:
          TOUTIAO_AUTH_B64: ${{ secrets.TOUTIAO_AUTH_B64 }}

      - name: 幂等保护 — 跳过已完成的批次
        id: dedup
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          BATCH="${{ inputs.batch || 'auto' }}"
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "batch=$BATCH" >> $GITHUB_OUTPUT

          # BATCH_CONFIG uses morning/noon/evening; orchestrator saves 'auto' as 'full'
          CHECK_BATCH="$BATCH"
          if [ "$CHECK_BATCH" = "auto" ]; then
            CHECK_BATCH="full"
          fi

          SKIP=$(TODAY="$TODAY" BATCH="$CHECK_BATCH" python3 scripts/check_batch_completed.py 2>/dev/null)

          if [ "$SKIP" = "true" ]; then
            echo "⏭️  批次 ${CHECK_BATCH} 今日已完成，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "   批次 ${CHECK_BATCH} 尚未完成，继续执行"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 时区校验
        if: steps.dedup.outputs.skip != 'true'
        id: tzcheck
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          BATCH="${{ inputs.batch || 'auto' }}"
          echo "cst_hour=$HOUR" >> $GITHUB_OUTPUT
          echo "batch=$BATCH" >> $GITHUB_OUTPUT

          # 校验：批次必须在对应的北京时间范围内
          # cron-job.org 时区设错（如设为 Asia/Shanghai 而非 UTC）会导致触发时间偏移
          valid=true
          case "$BATCH" in
            morning)
              if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            noon)
              if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            evening)
              if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            auto)
              # auto 模式：根据 CST 小时自动判断，校验是否在合理范围
              if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 22 ]; then
                echo "❌ 时区错误！当前北京时间 ${HOUR}:00，不在发文时段(06:00-22:00)"
                valid=false
              fi ;;
          esac

          if [ "$valid" = false ]; then
            echo ""
            echo "🔧 修复方法："
            echo "   1. 登录 cron-job.org → 右上角齿轮 → Timezone → 选择 (UTC) UTC"
            echo "   2. 确认不是 Asia/Shanghai 或其他时区"
            echo "   3. 如果使用 GitHub 原生 cron，确认 cron 表达式是 UTC 时间"
            exit 1
          fi
          echo "✅ 时区校验通过：${BATCH} 批次，北京时间 ${HOUR}:00"

      - name: 生成文章
        id: generate
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          python orchestrator.py "$TODAY" --batch=${{ inputs.batch || 'auto' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      - name: 发布到头条号
        if: success()
        run: |
          if [ -f toutiao_auth.json ]; then
            TODAY="${{ steps.generate.outputs.today }}"
            python publisher.py "$TODAY" --headless
          else
            echo "跳过发布：无头条号登录状态"
          fi
        env:
          TOUTIAO_AUTH_FILE: toutiao_auth.json
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      - name: 上传文章存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: output/
          retention-days: 7
