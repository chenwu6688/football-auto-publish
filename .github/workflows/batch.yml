name: 足球自媒体批次发布（含 fallback）

# 调度策略：
#   主调度: cron-job.org → daily.yml (精确，不延迟)
#   备调度: GitHub 原生 cron (延后 30 分钟，仅在主调度失败时兜底)
# 每条 cron 比主调度晚 30 分钟，且带幂等保护：如果 daily.yml 已完成，自动跳过。
on:
  schedule:
    # 08:30 CST = 00:30 UTC — 晨读 fallback
    - cron: '37 0 * * *'
    # 12:30 CST = 04:30 UTC — 午间 fallback
    - cron: '37 4 * * *'
    # 18:00 CST = 10:00 UTC — 晚间 fallback
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '批次 (morning/noon/evening，留空自动判断)'
        required: false
        type: choice
        options:
          - morning
          - noon
          - evening
      date:
        description: '日期 (YYYY-MM-DD，默认今天北京时间)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 写入头条号登录状态
        run: |
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > /tmp/auth/toutiao_auth.json

      - name: 确定批次和日期
        id: params
        run: |
          # Date
          if [ -z "${{ inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          else
            TODAY="${{ inputs.date }}"
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          # Batch: use input if provided, otherwise auto-detect from CST hour
          if [ -n "${{ inputs.batch }}" ]; then
            BATCH="${{ inputs.batch }}"
          else
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then
              BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then
              BATCH="noon"
            else
              BATCH="evening"
            fi
          fi
          echo "batch=$BATCH" >> $GITHUB_OUTPUT
          echo "运行: $TODAY $BATCH 批次"

          # 时区校验
          HOUR=$(TZ=Asia/Shanghai date +%H)
          valid=true
          case "$BATCH" in
            morning)
              if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                echo "❌ 时区错误！morning 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            noon)
              if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                echo "❌ 时区错误！noon 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            evening)
              if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                echo "❌ 时区错误！evening 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
          esac
          if [ "$valid" = false ]; then
            echo "🔧 请检查 cron-job.org 时区是否为 UTC，或手动指定正确的 batch"
            exit 1
          fi
          echo "✅ 时区校验通过"

          # 幂等保护：检查 daily.yml (cron-job.org) 是否已写入 output/
          echo "   检查主调度是否已完成..."
          SKIP=$(TODAY="$TODAY" BATCH="$BATCH" python3 scripts/check_batch_completed.py)
          if [ "$SKIP" = "true" ]; then
            echo "⏭️  批次 ${BATCH} 已被主调度完成，fallback 跳过"
            exit 0
          fi
          echo "   主调度未完成，fallback 接管"

      - name: 生成文章
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python orchestrator.py "${{ steps.params.outputs.today }}" --batch="${{ steps.params.outputs.batch }}"

      - name: 发布到头条号
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          python publisher.py "${{ steps.params.outputs.today }}" --headless

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ steps.params.outputs.batch }}-${{ steps.params.outputs.today }}
          path: ${{ runner.temp }}/output/${{ steps.params.outputs.today }}/

      - name: 失败通知
        if: failure()
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python -c "
          import requests
          requests.post('https://wxpusher.zjiecode.com/api/send/message',
            json={'appToken':'$WXPUSHER_APPTOKEN','content':'⚠️ ${{ steps.params.outputs.batch }} 批次发布失败\n日期: ${{ steps.params.outputs.today }}\n查看: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}','contentType':1,'uids':['$WXPUSHER_UID']})
          "
