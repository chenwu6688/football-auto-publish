name: 足球自媒体批次发布

# 双保险调度策略：
#   主调度: cron-job.org → workflow_dispatch API（精确到秒，UTC 时区）
#   备调度: 以下 GitHub 原生 cron（比主调度晚 30 分钟，幂等保护自动跳过已完成批次）
# 批次判断: 用当前 UTC 小时 ±2h 匹配已知 backup cron 时间，超出窗口则用 CST 自动检测。
on:
  schedule:
    # 08:30 CST = 00:30 UTC — 晨读 backup（主调度: cron-job.org 08:00 CST）
    - cron: '37 0 * * *'
    # 12:30 CST = 04:30 UTC — 午间 backup（主调度: cron-job.org 12:00 CST）
    - cron: '37 4 * * *'
    # 18:00 CST = 10:00 UTC — 晚间 backup（主调度: cron-job.org 17:30 CST）
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '批次 (morning/noon/evening，留空自动判断)'
        required: false
        type: choice
        options:
          - morning
          - noon
          - evening
      date:
        description: '日期 (YYYY-MM-DD，默认今天北京时间)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 写入头条号登录状态
        run: |
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > /tmp/auth/toutiao_auth.json

      - name: 确定批次和日期
        id: params
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Date
          if [ -z "${{ inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          else
            TODAY="${{ inputs.date }}"
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          # Batch determination
          # For schedule events: use UTC hour (backup crons at UTC 0,4,10) with ±2h tolerance.
          # Falls back to CST auto-detect if delayed beyond all windows.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_HOUR=$(date -u +%H)
            CST_HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$UTC_HOUR" -ge 0 ] && [ "$UTC_HOUR" -le 2 ]; then
              BATCH="morning"
            elif [ "$UTC_HOUR" -ge 4 ] && [ "$UTC_HOUR" -le 6 ]; then
              BATCH="noon"
            elif [ "$UTC_HOUR" -ge 9 ] && [ "$UTC_HOUR" -le 12 ]; then
              BATCH="evening"
            else
              # Delayed beyond backup windows — auto-detect from CST
              if [ "$CST_HOUR" -lt 10 ]; then BATCH="morning"
              elif [ "$CST_HOUR" -lt 15 ]; then BATCH="noon"
              else BATCH="evening"
              fi
            fi
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (schedule backup, UTC=$UTC_HOUR, CST=$CST_HOUR)"
          elif [ -n "${{ inputs.batch }}" ]; then
            BATCH="${{ inputs.batch }}"
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (手动指定)"
          else
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then
              BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then
              BATCH="noon"
            else
              BATCH="evening"
            fi
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (auto-detected, CST=$HOUR:00)"
          fi

          # 时区校验 — 仅对 auto-detect（无手动指定批次）执行
          if [ "${{ github.event_name }}" != "schedule" ] && [ -z "${{ inputs.batch }}" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            valid=true
            case "$BATCH" in
              morning)
                if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                  echo "❌ 时区错误！morning 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              noon)
                if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                  echo "❌ 时区错误！noon 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              evening)
                if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                  echo "❌ 时区错误！evening 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
            esac
            if [ "$valid" = false ]; then
              echo "🔧 如果是手动触发，请指定正确的 batch 参数"
              exit 1
            fi
            echo "✅ 时区校验通过"
          fi

          # 幂等保护：通过 GitHub API 读取最新 metadata（比本地文件更可靠）
          echo "   检查批次是否已执行..."
          META_API="repos/${{ github.repository }}/contents/output/${TODAY}/metadata.json?ref=main"
          COMPLETED=$(gh api "$META_API" --jq '.content | @base64d | fromjson | .batches_completed | join(",")' 2>/dev/null) || true
          if echo "$COMPLETED" | grep -q "$BATCH"; then
            echo "⏭️  批次 ${BATCH} 今日已完成，跳过"
            exit 0
          fi
          echo "   批次 ${BATCH} 尚未执行，继续"

      - name: 时区诊断
        if: always()
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  🕐 时区诊断                         ║"
          echo "╠══════════════════════════════════════╣"
          printf "║  %-20s %s ║\n" "UTC:" "$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf "║  %-20s %s ║\n" "CST (Asia/Shanghai):" "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          printf "║  %-20s %s ║\n" "GitHub event:" "${{ github.event_name }}"
          printf "║  %-20s %s ║\n" "Detected batch:" "${{ steps.params.outputs.batch }}"
          printf "║  %-20s %s ║\n" "Target date:" "${{ steps.params.outputs.today }}"
          echo "╚══════════════════════════════════════╝"

      - name: 生成文章
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python orchestrator.py "${{ steps.params.outputs.today }}" --batch="${{ steps.params.outputs.batch }}"

      - name: 发布到头条号
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          python publisher.py "${{ steps.params.outputs.today }}" --headless

      - name: 回写批次状态（幂等保护）
        if: success()
        env:
          TODAY: ${{ steps.params.outputs.today }}
          BATCH: ${{ steps.params.outputs.batch }}
        run: |
          SRC="${{ runner.temp }}/output/${TODAY}/metadata.json"

          if [ ! -f "$SRC" ]; then
            echo "⚠️ metadata.json 不存在，跳过回写"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DST="output/${TODAY}/metadata.json"
          mkdir -p "output/${TODAY}"

          # 合并 batches_completed，避免覆盖之前批次的状态
          python3 -c "
          import json
          from pathlib import Path

          src = Path('${SRC}')
          dst = Path('${DST}')
          new_meta = json.loads(src.read_text())

          if dst.exists():
              old_meta = json.loads(dst.read_text())
              old_batches = set(old_meta.get('batches_completed', []))
              new_batches = set(new_meta.get('batches_completed', []))
              new_meta['batches_completed'] = sorted(old_batches | new_batches)

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(json.dumps(new_meta, ensure_ascii=False, indent=2))
          print(f'merged batches: {new_meta[\"batches_completed\"]}')
          "

          git add -f "output/${TODAY}/metadata.json"

          if git diff --cached --quiet; then
            echo "📝 无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: ${TODAY} ${BATCH} 批次完成"

          # 重试推送：处理多批次并发写入时的 push 冲突
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ 批次状态已回写仓库"
              break
            fi
            echo "⚠️  推送失败 (attempt $attempt/3)，rebase 后重试..."
            git pull --rebase origin main
            if [ $attempt -eq 3 ]; then
              echo "❌ 推送失败，但不影响文章发布（metadata 可通过 artifact 恢复）"
              exit 0
            fi
            /usr/bin/sleep $((attempt * 2))
          done

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ steps.params.outputs.batch }}-${{ steps.params.outputs.today }}
          path: ${{ runner.temp }}/output/${{ steps.params.outputs.today }}/

      - name: 失败通知
        if: failure()
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python -c "
          import requests
          requests.post('https://wxpusher.zjiecode.com/api/send/message',
            json={'appToken':'$WXPUSHER_APPTOKEN','content':'⚠️ ${{ steps.params.outputs.batch }} 批次发布失败\n日期: ${{ steps.params.outputs.today }}\n查看: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}','contentType':1,'uids':['$WXPUSHER_UID']})
          "
