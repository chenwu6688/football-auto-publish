name: 足球自媒体批次发布

# ============================================================
# 唯一发布管道（单一兜底调度）
#
# 调度架构（已整合，详见 external-trigger/README.md）：
#   主调度 (准点): Cloudflare Worker (external-trigger/worker.js)
#                 在 CST 08:00 / 12:00 / 18:00 精确触发 workflow_dispatch
#   兜底 (可靠):  本文件的 GitHub Actions 原生 cron —— 仅作 backstop，
#                 比主调度晚 30 分钟触发，靠下方「幂等保护」跳过已被主调度
#                 完成的批次，绝不重复发文。
#
#   每个批次保留 2 个兜底 cron（target+30 / target+50），对抗 GitHub 免费
#   调度器在 UTC 00:xx 时段的偶发漏触发（实测曾整批漏触发）。
#
#   批次检测: schedule 事件从 github.event.schedule 解析 cron 表达式的 UTC hour
#   (0→morning, 4→noon, 10→evening)，不依赖当前时间，彻底解决 cron 延迟导致的批次误判。
#   workflow_dispatch 时直接使用 inputs.batch 参数（手动/补发通道）。
#
#   发布时段护栏（2026-10-12 新增）: 见 params step「死区护栏」——CST 00:00-05:59
#   一律跳过。869 条真实数据中凌晨发布 122 条、篇均阅读 60.5（全时段最差），
#   而 9-10 月有 41 条凌晨误发（均为 GitHub cron 延迟所致），此护栏杜绝该亏损。
# ============================================================
on:
  schedule:
    # 兜底：晨读（主调度 CST 08:00 → 兜底 CST 08:30 / 08:50 = UTC 00:30 / 00:50）
    - cron: '30 0 * * *'
    - cron: '50 0 * * *'
    # 兜底：午间（主调度 CST 12:00 → 兜底 CST 12:30 / 12:50 = UTC 04:30 / 04:50）
    - cron: '30 4 * * *'
    - cron: '50 4 * * *'
    # 兜底：晚间（主调度 CST 18:00 → 兜底 CST 18:30 / 18:50 = UTC 10:30 / 10:50）
    - cron: '30 10 * * *'
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '批次 (auto=按当前时间判断；补发某批请明确选 morning/noon/evening)'
        required: false
        type: choice
        # ⚠️ 必须显式给 default：choice 类型若不给 default，GitHub 会把「第一个选项」
        #    预选上。2026-11-05 19:07 手动补发 evening 时，操作者没动下拉框，
        #    实际提交的是 morning → 幂等保护看到「morning 今日已完成」→ 整批跳过，
        #    而 job 仍报 success（41s、无产物），从界面上完全看不出没干活。
        #    auto 放在第一位 = 盲点「Run workflow」也只会跑当前该跑的批次。
        default: auto
        options:
          - auto
          - morning
          - noon
          - evening
      date:
        description: '日期 (YYYY-MM-DD，默认今天北京时间)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read    # 失败兜底：查本 run 的分步结论，定位是哪一步失败（告警带原因）
    env:
      # 确保 Python stdout/stderr 实时 flush，避免超时被杀时日志空白
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Git 推送凭据
        run: |
          # 显式把 GITHUB_TOKEN 注入 remote，确保 git push 走令牌鉴权
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          # 中文字体（2026-11-05）：封面兜底数据卡用 PIL 画中文，runner 镜像里没有
          # CJK 字体时 Pillow 退化到位图字体，卡片上的汉字全成方框，而代码认为成功。
          # 这里装 Noto CJK；装失败不阻断发布（数据卡会返回 None 并写进 degrade 台账），
          # 但要用 ::warning:: 说出来，不许静默。
          if ! sudo apt-get update -qq; then
            echo "::warning::apt-get update 失败，尝试直接安装字体"
          fi
          if ! sudo apt-get install -y -qq fonts-noto-cjk; then
            echo "::warning::fonts-noto-cjk 安装失败 —— 本批封面数据卡会跳过（不会出版方框图）"
          fi
          if ! python3 cover_card.py --fontstatus; then
            echo "::warning::数据卡无中文字体可用，本批封面将退回「无封面」并留痕"
          fi

      - name: 静态分析 — 检查无未定义的函数引用
        run: |
          # 2026-11-04 事故：本步骤只解析 orchestrator.py / publisher.py 两个文件，
          # title_elements.py 的 3.12-only f-string 一路绿灯，直到生成步骤 import 才在
          # 3.11 上 SyntaxError（1 秒崩、告警只说「生成文章失败」）。
          # 用与生成步骤**同一个 python（3.11）**先编译全仓，把这类问题提前到静态分析阶段。
          if ! python -m compileall -q .; then
            echo "::error::本批 Python $(python -V 2>&1) 无法编译全仓，禁止继续生成（多半是 3.12-only 语法）。"
            exit 1
          fi
          python3 tests/test_no_dead_references.py

      - name: 恢复赛程库缓存（计划 11.4 · 落库缓存 / 业务侧只读库）
        # 赛程库是「库」而非一次性产物：跨运行保留，才能让补源按日轮换（4 日一轮）
        # 且每日调用量压在 3 次以内；否则每次运行都是冷启动，额度必然被联赛解析吃掉。
        uses: actions/cache@v4
        with:
          path: data/fixtures
          key: fixture-library-${{ github.ref_name }}
          restore-keys: |
            fixture-library-

      - name: 写入头条号登录状态
        run: |
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > /tmp/auth/toutiao_auth.json

      - name: 确定批次和日期
        id: params
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Date
          if [ -z "${{ inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          else
            TODAY="${{ inputs.date }}"
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          # Batch determination
          # For schedule events: parse github.event.schedule to get the INTENDED
          # batch, not the current execution time. This is critical because GitHub
          # cron delays of 5+ hours will cause UTC-hour-window detection to misidentify
          # the batch (e.g., morning cron delayed to UTC 4 → detected as noon).
          # Falls back to UTC window detection if schedule parsing fails.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHEDULE_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            UTC_HOUR=$(date -u +%H)
            CST_HOUR=$(TZ=Asia/Shanghai date +%H)
            case "$SCHEDULE_HOUR" in
              0|23) BATCH="morning" ;;
              4)    BATCH="noon" ;;
              10)   BATCH="evening" ;;
              *)
                # Fallback: UTC hour window (±2h tolerance)
                if [ "$UTC_HOUR" -ge 0 ] && [ "$UTC_HOUR" -le 2 ]; then BATCH="morning"
                elif [ "$UTC_HOUR" -ge 22 ] && [ "$UTC_HOUR" -le 23 ]; then BATCH="morning"
                elif [ "$UTC_HOUR" -ge 4 ] && [ "$UTC_HOUR" -le 6 ]; then BATCH="noon"
                elif [ "$UTC_HOUR" -ge 9 ] && [ "$UTC_HOUR" -le 12 ]; then BATCH="evening"
                else
                  if [ "$CST_HOUR" -lt 10 ]; then BATCH="morning"
                  elif [ "$CST_HOUR" -lt 15 ]; then BATCH="noon"
                  else BATCH="evening"
                  fi
                fi
                ;;
            esac
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (schedule trigger, UTC=$UTC_HOUR, CST=$CST_HOUR)"
          elif [ -n "${{ inputs.batch }}" ] && [ "${{ inputs.batch }}" != "auto" ]; then
            BATCH="${{ inputs.batch }}"
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (手动指定)"
          else
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then
              BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then
              BATCH="noon"
            else
              BATCH="evening"
            fi
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (auto-detected, CST=$HOUR:00)"
          fi

          # 时区校验 — 仅对 auto-detect（无手动指定批次 / auto）执行
          if [ "${{ github.event_name }}" != "schedule" ] && { [ -z "${{ inputs.batch }}" ] || [ "${{ inputs.batch }}" = "auto" ]; }; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            valid=true
            case "$BATCH" in
              morning)
                if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                  echo "❌ 时区错误！morning 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              noon)
                if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                  echo "❌ 时区错误！noon 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              evening)
                if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                  echo "❌ 时区错误！evening 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
            esac
            if [ "$valid" = false ]; then
              echo "🔧 如果是手动触发，请指定正确的 batch 参数"
              exit 1
            fi
            echo "✅ 时区校验通过"
          fi

          # 发布时段护栏（2026-10-12）：CST 00:00-05:59 为死区，一律不发。
          # 依据：869 条真实数据中凌晨发布 122 条、篇均阅读 60.5（全时段最差；
          #      最优为晚间 18:00 档，点击率 2.27%）。9-10 月有 41 条凌晨误发，
          #      均为 GitHub cron 延迟（主调度 Cloudflare 准点，兜底 cron 会漂移）。
          # 仅约束 schedule 事件；workflow_dispatch（人工补发 / CF 主调度）不受限。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            _DZH=$(TZ=Asia/Shanghai date +%H)
            if [ "$_DZH" -lt 6 ]; then
              echo "🌙 CST ${_DZH}:00 属发布死区（00:00-05:59），跳过本批发布（避免在无流量时段浪费内容）"
              echo "::warning::调度延迟至 CST ${_DZH}:00（死区），本批已跳过；请检查主调度（Cloudflare Worker）是否失效"
              echo "dead_zone=true" >> $GITHUB_OUTPUT
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 延迟兜底防错位（2026-10-12 夜实证）：schedule 的预期 CST 日期 = 运行日 UTC 日期
          # （三班目标 08/12/18 CST 均与 UTC 同日，cron 00/04/10）。一旦实际 CST 日期跨天，
          # 说明该兜底 cron 已严重延迟、其目标批次所属日期整体过去——放行只会把内容写到
          # 错误日期：实证 2026-10-11 晚间兜底（UTC 10:30）延迟 5.6h，于 10-12 00:14 CST
          # 生成并发布「10-12 晚间」4 篇，提前消耗次日晚间配额外还撞上凌晨低效时段。
          # 同日延迟放行（兜底救场：今晨 08:01 主调度因合规误报熔断失败，14:15 兜底补回晨读）。
          # workflow_dispatch（人工补发 / CF 主调度）不受此限——它按当前 CST 定日期，无错位风险。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            _INTENDED_DATE=$(date -u +%Y-%m-%d)
            _ACTUAL_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            if [ "$_ACTUAL_DATE" != "$_INTENDED_DATE" ]; then
              echo "⏭️  兜底 cron 跨 CST 日期延迟（预期 ${_INTENDED_DATE} → 实际 ${_ACTUAL_DATE} ${CST_HOUR}:00），跳过本批，避免把 ${BATCH} 批次写到错误日期"
              echo "::warning::兜底 cron 严重延迟已跨 CST 日期，本批跳过；请检查主调度（Cloudflare Worker）是否准点触发"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 延迟兜底防错位·三：批次槽位尚未开始就放行 = 提前消耗未来槽位——on-time 主调度
          # 随后会被幂等保护跳过，「准点发布」静默退化。实证场景：晚间兜底（cron UTC 10）
          # 延迟到次日 CST 06:00-14:59 放行，会写下「当日 evening」，把当日 18:00 峰值档
          # 提前大半天消耗掉（与 2026-10-12 夜同源，只是延迟时长跨过了 UTC 零点）。
          # 槽位起点与时区校验窗口一致：morning 06 / noon 10 / evening 15。
          # 同日延迟（槽内或槽后）放行——兜底救场，如今晨 14:15 补回晨读。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$BATCH" in
              morning) _SLOT_START=6 ;;
              noon)    _SLOT_START=10 ;;
              evening) _SLOT_START=15 ;;
              *)       _SLOT_START=0 ;;
            esac
            if [ "$CST_HOUR" -lt "$_SLOT_START" ]; then
              echo "⏭️  ${BATCH} 批次槽位（CST ${_SLOT_START}:00 起）尚未开始（当前 CST ${CST_HOUR}:00），跳过本批，避免提前消耗未来槽位"
              echo "::warning::兜底 cron 早于批次槽位放行，本批跳过；请检查主调度（Cloudflare Worker）是否准点触发"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 幂等保护：通过 GitHub API 读取最新 metadata（比本地文件更可靠）
          echo "   检查批次是否已执行..."
          META_API="repos/${{ github.repository }}/contents/output/${TODAY}/metadata.json?ref=main"
          COMPLETED=$(gh api "$META_API" --jq '.content | @base64d | fromjson | .batches_completed | join(",")' 2>/dev/null) || true
          if echo "$COMPLETED" | grep -q "$BATCH"; then
            echo "⏭️  批次 ${BATCH} 今日已完成，跳过"
            # 「跳过」不能长得像「成功」。2026-11-05 19:07 补发 evening 时操作者
            # 未改下拉框（默认 morning），本批被幂等跳过，但 run 页面只有绿勾 +
            # 「Success 41s」，人工无法判断到底发没发。故落 Job Summary + 告警注释。
            echo "::warning::批次 ${BATCH} 今日已完成（batches_completed=${COMPLETED}），本次未做任何事。如需补发其他批次，请在 Run workflow 时明确选择 morning/noon/evening"
            {
              echo "## ⏭️ 本批未执行（幂等保护跳过）"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 目标批次 | \`${BATCH}\` |"
              echo "| 日期 | \`${TODAY}\` |"
              echo "| 已完成批次 | \`${COMPLETED}\` |"
              echo "| 本次动作 | **无**（未生成、未发布） |"
              echo ""
              echo "> 绿色勾只代表「按幂等规则跳过」，不代表今天这篇发出来了。"
              echo "> 若要补发，重跑时把 batch 明确选成目标批次（默认值是 auto）。"
            } >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "   批次 ${BATCH} 尚未执行，继续"

      - name: 时区诊断
        if: always()
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║  🕐 时区诊断                         ║"
          echo "╠══════════════════════════════════════╣"
          printf "║  %-20s %s ║\n" "UTC:" "$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf "║  %-20s %s ║\n" "CST (Asia/Shanghai):" "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          printf "║  %-20s %s ║\n" "GitHub event:" "${{ github.event_name }}"
          printf "║  %-20s %s ║\n" "Detected batch:" "${{ steps.params.outputs.batch }}"
          printf "║  %-20s %s ║\n" "Target date:" "${{ steps.params.outputs.today }}"
          printf "║  %-20s %s ║\n" "Skip:" "${{ steps.params.outputs.skip }}"
          echo "╚══════════════════════════════════════╝"

      - name: 同步已有批次元数据（跨批次去重）
        if: steps.params.outputs.skip != 'true'
        run: |
          # Copy previously pushed metadata from repo to orchestrator's data dir
          # so get_cross_batch_covered() can see earlier batches' articles
          if [ -d "output" ]; then
            mkdir -p "${{ runner.temp }}/output"
            cp -r output/* "${{ runner.temp }}/output/" 2>/dev/null || true
            echo "✅ 已同步历史批次元数据到 OUTPUT_DIR"
          fi

      - name: 合规熔断检查（计划第十章 · 不实违规即暂停自动发布）
        if: steps.params.outputs.skip != 'true'
        run: |
          python3 compliance_guard.py --status
          if ! python3 compliance_guard.py --status --exit-code-if-suspended; then
            # 结构化失败原因落到固定路径，由「失败通知」步骤读走——
            # 手机端只看到「批次发布失败」等于没告警（2026-10-25 连收三次无原因告警）
            python3 scripts/write_failure_reason.py "合规熔断（未解除）" || true
            echo "::error::合规熔断中，自动发布已暂停；请人工定位原因后执行 python3 compliance_guard.py --clear"
            exit 1
          fi

      - name: 刷新赛程选题池（确定性供给）
        if: steps.params.outputs.skip != 'true'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_HOST: ${{ secrets.API_FOOTBALL_HOST }}
        run: |
          # 计划 11.4：14 天窗口落库；全部外部调用过 api_budget 台账（≤3 次/日）
          python scripts/fixture_library.py --days 14 \
            || echo "::warning::赛程选题池刷新失败，沿用已有 topic_pool（如有）"

      - name: 赛程选题池验收（计划 7.1 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true'
        run: |
          # 五类覆盖 / 单日候选≥6 / 前瞻体为 0 为硬项；不达标仅告警，不阻断发布（计划九）
          python3 scripts/verify_fixture_pool.py --quiet \
            || echo "::warning::赛程选题池未达 7.1 验收标准，详见 data/audit/fixture_pool_latest.json"

      - name: 接口额度验收（计划 11.4 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true'
        run: |
          # 硬项：无超限日 + 14 天窗口落库；不达标仅告警，不阻断发布（计划九）
          python3 scripts/verify_api_budget.py --days 14 --quiet \
            || echo "::warning::接口额度台账未达 11.4 验收标准，详见 data/audit/api_budget_latest.json"

      - name: 补充软性内容蓄水池（三级供给 · 计划 12.1）
        if: steps.params.outputs.skip != 'true'
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          # 供给不足时由蓄水池补位；此处按水位线备货（只补缺口，控制 token 成本）
          python scripts/refill_reservoir.py --target 8 --max-gen 3 \
            || echo "::warning::蓄水池备货失败，沿用现有库存（非阻断）"

      - name: 补充一级确定性节点供给（计划 12.1 · 提前量产入库）
        if: steps.params.outputs.skip != 'true'
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          # 节点事件（转会窗截止日/赛季节点/开赛倒计时）提前 7 天量产入库；只补窗口内缺口
          python scripts/pregen_deterministic.py --days 7 --max-gen 2 \
            || echo "::warning::一级节点量产失败，沿用现有库存（非阻断）"

      - name: 提示词合规自检（生成前 · 配置错了就别烧 token）
        # 2026-11-06 晚事故：判定侧把「索要关注 / 扣1 / 站队」改成 20 分档违规，
        # 但生成提示词仍在**强制要求**。模型照提示词写，写完被自己的闸门拦掉，
        # 烧 388 秒生成 4 篇、篇篇被丢，最终整批 0 篇、发布失败。
        #
        # 这里**允许停整批**，与「命中丢该篇、绝不停整批」不冲突：那条规矩针对
        # 「某一篇稿子有问题」，而提示词违规是**上游配置错了**——照这个提示词
        # 生成下去每一篇都会被拦，停批只损失几秒，不停批要烧两分钟还发不出稿。
        #
        # H 项「提示词方向一致」：黑名单从 config/interaction_bait.yaml 读，
        # 扫 prompts/*.txt 与 constants.py，命中即红。
        if: steps.params.outputs.skip != 'true'
        run: |
          python3 scripts/verify_rule_coverage.py --selftest >/dev/null \
            || echo "::warning::规则覆盖负向自检失败——检查项可能已失去检出能力"
          rc=0
          python3 scripts/verify_rule_coverage.py --quiet || rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 scripts/write_failure_reason.py "规则/提示词一致性检查未通过" || true
            echo "::error::规则与提示词一致性检查未通过（常见原因：提示词在教模型写平台判违规的话术），详见 data/audit/rule_coverage_latest.json"
            exit 1
          fi
          echo "✅ 规则表 / 判据 / 发布门禁 / 生成提示词 四方一致"

      - name: 生成文章
        id: generate
        if: steps.params.outputs.skip != 'true'
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python orchestrator.py "${{ steps.params.outputs.today }}" --batch="${{ steps.params.outputs.batch }}"

      - name: 传闻措辞验收（计划 4.1 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项：措辞规则自检 + 分级常量同源 + 成稿标题零「传闻当官宣」
          python3 scripts/verify_rumor_wording.py --quiet \
            || echo "::warning::传闻措辞未达 4.1 验收标准，详见 data/audit/rumor_wording_latest.json"

      - name: 内容参照层验收（计划 13.3 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项：排除项规则自检 + 配置完整性 + ranker/生成提示接入
          python3 scripts/verify_content_reference.py --quiet \
            || echo "::warning::内容参照层未达 13.3 验收标准，详见 data/audit/content_reference_latest.json"

      - name: 差异化方向验收（计划 13.5 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项：六方向结构齐备 + 代码 hook 落地
          python3 scripts/verify_differentiation.py --quiet \
            || echo "::warning::差异化方向未达 13.5 验收标准，详见 data/audit/differentiation_latest.json"

      - name: 配图下限验收（每篇 ≥ 3 张 · 质量项，只告警）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 2026-11-06 降级为 quality（见 config/audit_tiers.yaml）。
          # 平台规则里没有「每篇几张图」这一条；与之相关的扣分项是「图文不符/
          # 相关性差 10 分」，由下一步 image_relevance 判定。张数本身是用户偏好，
          # 拿它阻断发布，本质上是让配图数量决定今天有没有稿子发——
          # 而 11-05 的真实教训恰恰是「图源抖动 → 整批 0 篇」，与扣分无关。
          # 数量仍然每天在 data/audit/article_images_latest.json 留痕。
          python3 scripts/verify_article_images.py --quiet \
            || echo "::warning::配图张数未达每篇 3 张（质量项，不阻断发布），详见 data/audit/article_images_latest.json"

      - name: 配图相关性验收（硬项阻断 · 产物相关性只告警）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 分两层（2026-11-06 改）：
          #   硬项 A-D（接线 / 闸门行为 / 不画假图 / 无残留图）→ 红了说明闸门
          #   本身坏了，必须阻断。
          #   产物相关性（E）→ **只告警**。逐篇相关性已由出口合规审核（TT-09
          #   image_relevance）处置，命中只丢该篇；这里再整批拦一次等于「同一
          #   风险两处判定」，而且会把「某一篇的图不对」放大成「整批 0 篇」——
          #   11-06 午间 0 篇正是这么发生的。
          # 用 --fail-on-hard-only 而不是 `|| echo`：硬项照样硬，只放开 E，
          # 没通过时脚本自己打 ::warning::，不会变成「有验收的假象」。
          rc=0
          python3 scripts/verify_image_relevance.py --quiet --fail-on-hard-only || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::配图相关性硬项未通过（闸门接线/行为坏了），详见 data/audit/image_relevance_latest.json"
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::warning::配图相关性未判定（窗口内没有本改动之后的批次产物）"
          fi

      - name: 热点选题通道验收（2026-11-06 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 判的是「接线对不对」而不是「今天有没有热点」，所以只告警：
          # 验收器自己出 bug 时不该决定今天有没有稿子发。
          # --selftest 是负向自检：把事件键退回旧写法必须报红，否则这条判据是摆设。
          python3 scripts/verify_hot_freshness.py --selftest \
            || echo "::warning::热点通道负向自检失败——D 项已失去检出能力"
          python3 scripts/verify_hot_freshness.py --quiet \
            || echo "::warning::热点通道未通过，详见 data/audit/hot_freshness_latest.json"

      - name: 发布闸门验收（计划 7.2 / 7.3 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项：成稿标题零硬违规 + 一致性拦截率可统计 + 连续 14 天无旧闻新发
          python3 scripts/verify_publish_gate.py --quiet \
            || echo "::warning::发布闸门未达 7.2/7.3 验收标准，详见 data/audit/publish_gate_latest.json"

      - name: 单批篇数纪律验收（策略手册第五章 / 计划 12.1 · 只告警不阻断）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项：常态 2 篇不超手册上限 + 加发不超手册 + 日合计 6-8 + 三处口径一致 + decide 冒烟
          python3 scripts/verify_batch_quota.py --quiet \
            || echo "::warning::单批篇数纪律未达手册/计划标准，详见 data/audit/batch_quota_latest.json"

      - name: 内容类型配比复核（2026-11-01 月度分析 · 禁发类型硬拦）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 硬项（FAIL 即停）：目标表自洽 + 生效日后禁发类型（历史回顾）零产出 + 复核确已接入
          # 告警项（不影响退出码）：热点球评占比低于目标 —— 配比是慢变量，按天卡死会逼出凑数稿
          # 刻意不加 `|| echo`：禁发类型还在产出就不该放行发布
          python3 scripts/verify_content_mix.py --days 7 --quiet

      - name: 回写状态（LLM 用量 + 软性蓄水池）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        run: |
          # 持久化 LLM 额度消耗（供下次按阈值选模型）
          # + 软性内容蓄水池（计划 12.1：跨日复用，突发日补位）
          git config user.name "github-actions[bot]" || true
          git config user.email "github-actions[bot]@users.noreply.github.com" || true
          git add -f data/llm_usage.json || true
          git add -f data/reservoir || true
          # 一级·确定性节点库存（计划 12.1：提前量产入库，跨日复用）
          git add -f data/deterministic || true
          # 合规熔断状态（计划第十章：不实违规即熔断，跨运行持久化）
          git add -f data/compliance_state.json || true
          # 加发留痕台账（策略手册第五章：周内加发 ≤ 2 次，跨运行累计）
          git add -f data/uplift_ledger.json || true
          # 验收审计报告（计划 4.1/7.1/11.4 等：看板与门槛报告随运行留痕）
          git add -f data/audit || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 回写 LLM 用量与软性蓄水池"
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "✅ 状态已回写（LLM 用量 + 蓄水池）"
                break
              fi
              echo "⚠️  推送失败 (attempt $attempt/3)，rebase 后重试..."
              git pull --rebase origin main || true
              sleep $((attempt * 2))
            done
          else
            echo "📝 状态无变化，跳过提交"
          fi

      - name: 回写生成结果（跨批次去重）
        if: steps.params.outputs.skip != 'true' && !cancelled()
        env:
          TODAY: ${{ steps.params.outputs.today }}
          BATCH: ${{ steps.params.outputs.batch }}
        run: |
          # Push generated article metadata immediately so later batches
          # (or delayed crons) can see today's already-published topics.
          SRC="${{ runner.temp }}/output/${TODAY}/metadata.json"
          if [ ! -f "$SRC" ]; then
            echo "⚠️ metadata.json 不存在，跳过回写"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DST="output/${TODAY}/metadata.json"
          mkdir -p "output/${TODAY}"
          # 合并 + 重算配图下限统计都交给脚本：内联两个版本各算一次
          # image_floor，导致 articles_below 只反映最后一批（2026-11-05）。
          python3 scripts/merge_metadata.py --src "$SRC" --dst "$DST" \
            || { echo "⚠️ 元数据合并失败，使用新数据"; cp "$SRC" "$DST"; }
          git add -f "output/${TODAY}/metadata.json" || true
          if git diff --cached --quiet; then
            echo "📝 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: ${TODAY} ${BATCH} 生成完成元数据回写"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ 生成结果已回写仓库"
              break
            fi
            echo "⚠️  推送失败 (attempt $attempt/3)，rebase 后重试..."
            git pull --rebase origin main || true
            /usr/bin/sleep $((attempt * 2))
          done

      - name: 合规熔断复核（生成后 · 计划第十章：熔断须拦住当前批次）
        id: compliance_recheck
        if: steps.params.outputs.skip != 'true'
        run: |
          # 2026-10-13 事故根因：一致性打回超阈值的熔断在「生成文章」步骤才触发，
          # 而本工作流此前只在批次开头检查一次 → 当晚批次照常发布，故障延后一整批。
          # 本步骤在发布前复核：生成阶段触发的熔断同样中止当前批次（宁停勿错）。
          # 置于「回写状态」之后——彼时 compliance_state.json 已提交落库，复核的是持久化事实。
          python3 compliance_guard.py --status
          if python3 compliance_guard.py --status --exit-code-if-suspended; then
            echo "suspended=false" >> $GITHUB_OUTPUT
            echo "✅ 合规状态正常，允许发布"
          else
            python3 scripts/write_failure_reason.py "生成阶段触发合规熔断" || true
            echo "suspended=true" >> $GITHUB_OUTPUT
            echo "::error::生成阶段已触发合规熔断——本批发布中止（宁停勿错）。请人工定位原因后运行 python3 compliance_guard.py --clear 解除，再手动补发本批次。"
            exit 1
          fi

      - name: 合规审核（头条发文规则 · 逐篇剔除，不停整批）
        id: compliance
        if: steps.params.outputs.skip != 'true'
        run: |
          # 2026-11-06 立：这是「会不会被头条扣分」的唯一入口，读 config/toutiao_rules.yaml
          # 逐条判定（14 条规则 / 12 条可用判据），输出命中规则与潜在扣分合计。
          # 放在发布前、生成后：此刻成稿 md 还在本 runner 上，正文类判据才判得动。
          #
          # 先用 --selftest 证明判据真的在判。
          # 再跑 --drop-violations --fail-on-block-only：
          #   · 命中 block/rewrite 的篇**逐篇移出发布集合**（md 进 output/<date>/dropped/），
          #     其余照发 —— 处置原则「丢该篇、不停整批」。
          #     2026-11-06 之前这里是 `exit 1` 停整批：一篇的图不对或一句话涉赌，
          #     代价是当批 0 篇，而 0 篇又会被下游当成「上游空转」重跑。
          #   · 「未判定」（正文读不到/证据缺失）不拦发布——11-06 noon 那次 0 篇，
          #     根因正是把「读不到证据」当成了「不通过」。未判定由每日层裸 rc=2 暴露。
          python3 scripts/verify_compliance.py --selftest \
            || echo "::warning::合规负向自检失败——判据可能已失去检出能力"
          rc=0
          python3 scripts/verify_compliance.py --days 1 --drop-violations \
            --fail-on-block-only --quiet || rc=$?
          if [ "$rc" -eq 3 ]; then
            python3 scripts/write_failure_reason.py "成稿全部被合规剔除" || true
            echo "::error::本批成稿被合规审核全部剔除，发布集合 0 篇——这是「全丢」不是「空批」，需按 data/audit/compliance_dropped_*.json 逐条复核规则是否过严"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            python3 scripts/write_failure_reason.py "成稿命中头条扣分规则（批量级）" || true
            echo "::error::合规审核未通过，详见 data/audit/compliance_latest.json——本批停发，宁停勿错"
            exit 1
          fi
          echo "✅ 合规审核通过（单篇级违规已逐篇剔除，其余照发）"

      - name: 发布到头条号
        id: publish
        if: steps.params.outputs.skip != 'true' && steps.compliance_recheck.outputs.suspended != 'true'
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          # 三态退出码（publisher.py 顶部 EXIT_*）：
          #   0 = 至少一篇发出去了
          #   2 = 本批有稿但全被规则跳过（预测稿判 opinion_only 等）→ 重跑没意义，标批次完成
          #   3 = 本批一篇成稿都没有（上游空转）→ 不标完成，留给 30/50 分兜底 cron 重跑
          #   1 = 真失败（登录失效/熔断/浏览器异常/全部发布失败）
          # 以前三种终态共用一个 exit 1：批次被判失败、却又被写成「已完成」，
          # 补发被幂等跳过 → 当批永久丢失（2026-11-05 晚间实证）。
          set +e
          python publisher.py "${{ steps.params.outputs.today }}" --headless --batch="${{ steps.params.outputs.batch }}"
          RC=$?
          set -e
          echo "publish_rc=$RC" >> "$GITHUB_OUTPUT"
          case "$RC" in
            0)
              echo "publish_state=published" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "publish_state=nothing_skipped" >> "$GITHUB_OUTPUT"
              echo "::warning::本批有稿但全部被规则跳过（预测稿判「依据不足/断言/押比分」），本批发布 0 篇；详见 data/audit/publish_ledger_*_*.json 的 no_publishable"
              {
                echo "### ⚠️ 本批发布 0 篇（有稿，但全被规则跳过）"
                echo ""
                echo "重跑不会有不同结果，本批按「无事可做」收尾并标记完成。"
                echo "原因见发布台账 \`no_publishable\` 字段（tier + 具体理由）。"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "publish_state=nothing_empty" >> "$GITHUB_OUTPUT"
              # 0 篇有三种成因（上游空转 / 风险闸门全转人工 / 合规全剔除），处置互相
              # 排斥：前一种等兜底 cron 重跑，后两种重跑没用。原因由 orchestrator 写进
              # metadata.zero_publish_reason，这里原样引用，不再笼统打「上游空转」——
              # 11-10 evening / 11-11 morning 就是被这句笼统文案盖住了真实原因。
              _META="${{ runner.temp }}/output/${{ steps.params.outputs.today }}/metadata.json"
              _WHY=$(python3 scripts/publish_zero_reason.py "$_META" 2>/dev/null \
                     || echo "本批 0 篇成稿（上游空转：没有选题或没产出成稿）")
              echo "::error::本批发布 0 篇 —— ${_WHY}"
              {
                echo "### ❌ 本批发布 0 篇"
                echo ""
                echo "**原因**：${_WHY}"
                echo ""
                echo "本批**不**标记完成（避免人工补发被幂等跳过）。"
                echo ""
                echo "处置：若原因是「上游空转」→ 30/50 分兜底 cron 会重跑；"
                echo "若是「风险闸门/合规」→ 重跑没有意义，按原因去复核 "
                echo "\`output/<date>/review/\` 或 \`compliance_dropped\` 后再手动补发。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "publish_state=failed" >> "$GITHUB_OUTPUT"
              exit "$RC"
              ;;
          esac

      - name: 发布结果验收（发布成功率 · 只告警不阻断）
        # 稿子已经发出去了，这里阻断没有意义；存在的目的是把「发失败了」变成可见的告警。
        # 2026-11-04 午间 1 篇发布超时失败，台账如实写了原因，但当时没有任何环节在读它。
        if: always() && steps.params.outputs.skip != 'true'
        run: |
          python3 scripts/verify_publish_success.py --days 7 --quiet \
            || echo "::warning::发布成功率未达 85% / 出现连续失败 / 失败无原因，详见 data/audit/publish_success_latest.json"

      - name: 回写批次状态（幂等保护）
        # 熔断中止的批次不标记完成：否则解除熔断后手动补发会被幂等保护跳过，
        # 本批文章永远发不出去（2026-10-13 事故恢复路径验证）。
        #
        # 2026-11-05 晚间追加：**发布步骤失败时同样不许标记完成**。
        # 那晚 publisher.py 因「无可发布文章」exit 1，本步骤照样把 evening 写进
        # batches_completed —— 于是批次显示「已完成」，人工补发会被幂等跳过，
        # 当批永久丢失（已手工从 metadata 移除 evening 才救回）。
        # 代价：真正失败的批次会被 30/50 分兜底 cron 重试一次；这比静默丢批好。
        if: always() && steps.params.outputs.skip != 'true' && steps.compliance_recheck.outputs.suspended != 'true' && steps.publish.outcome == 'success'
        env:
          TODAY: ${{ steps.params.outputs.today }}
          BATCH: ${{ steps.params.outputs.batch }}
        run: |
          SRC="${{ runner.temp }}/output/${TODAY}/metadata.json"

          if [ ! -f "$SRC" ]; then
            echo "⚠️ metadata.json 不存在，跳过回写"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DST="output/${TODAY}/metadata.json"
          mkdir -p "output/${TODAY}"

          # 合并 batches_completed，避免覆盖之前批次的状态
          # BUGFIX: 从 dst（step 11 已合并后的元数据）读取，而非 src（仅当前批次）
          # 否则会覆盖 step 11 合并好的跨批次文章列表
          # 合并 + 重算配图下限统计都交给脚本：内联两个版本各算一次
          # image_floor，导致 articles_below 只反映最后一批（2026-11-05）。
          python3 scripts/merge_metadata.py --src "$SRC" --dst "$DST" \
            || { echo "⚠️ 元数据合并失败，使用新数据"; cp "$SRC" "$DST"; }

          # 「已完成」在这里、且只在这里写（2026-11-06 事故后的唯一写入点）。
          # 生成侧只写 batches_generated：noon 那批生成 2 篇、配图硬项失败、
          # 发布整段 skipped，可 completed 早在「生成完成元数据回写」时就进了仓库，
          # 幂等保护据此判定「本批已完成」，补发与兜底 cron 全部跳过，两篇稿永久丢。
          python3 scripts/mark_batch_completed.py --date "$TODAY" --batch "$BATCH" \
            || echo "::warning::标记批次完成失败（稿子已发布，仅状态回写未成功，下次运行会补齐）"

          git add -f "output/${TODAY}/metadata.json" || true
          # 发布结果台账（2026-11-01）：成稿数 ≠ 发布数，不落库就永远是黑箱。
          # 10 月成稿 242 / 实际发布 93，这个 62% 的漏斗一个月都没人发现。
          # 台账三层：批次明细 + 当天聚合 + latest（见 publisher.write_publish_ledger）
          git add -f data/audit/publish_ledger_*.json || true

          if git diff --cached --quiet; then
            echo "📝 无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: ${TODAY} ${BATCH} 批次完成"

          # 重试推送：处理多批次并发写入时的 push 冲突
          # 注意：git pull --rebase 必须带 || true，否则其失败会以 128 顶出整步
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ 批次状态已回写仓库"
              break
            fi
            echo "⚠️  推送失败 (attempt $attempt/3)，rebase 后重试..."
            git pull --rebase origin main || true
            /usr/bin/sleep $((attempt * 2))
          done
          echo "ℹ️ 若上方出现推送失败：文章已发布成功，仅仓库元数据回写未成功（下次运行可自动补齐）"
      - name: 导出小程序静态数据
        if: steps.params.outputs.skip != 'true' && !cancelled() && steps.compliance_recheck.outputs.suspended != 'true'
        env:
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          python scripts/export_static_data.py "${{ steps.params.outputs.today }}"
          # 提交 static_data/ 到仓库
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static_data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: ${{ steps.params.outputs.today }} ${{ steps.params.outputs.batch }} 更新小程序静态数据"
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "✅ 小程序静态数据已推送 (jsDelivr CDN 约 2-5 分钟生效)"
                break
              fi
              echo "⚠️  推送失败 (attempt $attempt/3)"
              git pull --rebase origin main || true
              /usr/bin/sleep $((attempt * 2))
            done
          else
            echo "📝 static_data/ 无变化，跳过提交"
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ steps.params.outputs.batch }}-${{ steps.params.outputs.today }}
          path: ${{ runner.temp }}/output/${{ steps.params.outputs.today }}/

      - name: 推送诊断（排错用，始终运行）
        if: always()
        run: |
          echo "=== git remote -v ==="
          git remote -v
          echo "=== 最近一次提交 ==="
          git log -1 --oneline 2>/dev/null || true
          echo "=== 排错提示 ==="
          echo "若文章已成功发布到头条号，但本运行仍因 git push 失败而告警："
          echo "请检查仓库 Settings → Branches → main 是否开启了"
          echo "'Require a pull request before merging'（该保护会禁止 GITHUB_TOKEN 直接推送）。"
          echo "如开启，请关闭该保护，或为 GITHUB_TOKEN 添加绕过规则。"

      - name: 失败原因兜底（定位失败步骤）
        # 合规熔断两处中止点会写精确原因；其余失败（生成/发布/登录/git push）由此处
        # 从 API 反查失败步骤名，保证告警正文永远有「原因」而不是「详见日志」。
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/write_failure_reason.py --from-run-api

      - name: 失败通知
        if: failure()
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WB_BATCH: ${{ steps.params.outputs.batch }}
          WB_TODAY: ${{ steps.params.outputs.today }}
          WB_REPO: ${{ github.repository }}
          WB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/notify_failure.py
