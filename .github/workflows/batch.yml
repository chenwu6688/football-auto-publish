name: 足球自媒体批次发布

# GitHub 原生 cron 调度（UTC 时间）。
# 重要：GitHub Actions cron 延迟可达数小时，批次由 cron 表达式中的 UTC 小时决定，绝不依赖执行时刻的北京时间自动判断。
on:
  schedule:
    # 08:00 CST = 00:00 UTC — 晨读
    - cron: '7 0 * * *'
    # 12:00 CST = 04:00 UTC — 午间
    - cron: '7 4 * * *'
    # 17:30 CST = 09:30 UTC — 晚间
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '批次 (morning/noon/evening，留空自动判断)'
        required: false
        type: choice
        options:
          - morning
          - noon
          - evening
      date:
        description: '日期 (YYYY-MM-DD，默认今天北京时间)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 写入头条号登录状态
        run: |
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > /tmp/auth/toutiao_auth.json

      - name: 确定批次和日期
        id: params
        run: |
          # Date
          if [ -z "${{ inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          else
            TODAY="${{ inputs.date }}"
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT

          # Batch determination
          # For schedule events: extract intended batch from the cron expression's UTC hour.
          # This is essential because GitHub Actions cron jobs can be delayed by hours;
          # we must NOT auto-detect batch from current CST time when delayed.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CRON="${{ github.event.schedule }}"
            UTC_HOUR=$(echo "$CRON" | awk '{print $2}')
            case "$UTC_HOUR" in
              0) BATCH="morning" ;;
              4) BATCH="noon" ;;
              9) BATCH="evening" ;;
              *) BATCH="auto" ;;
            esac
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (cron: $CRON → UTC hour=$UTC_HOUR)"
            echo "✅ Cron 指定批次，跳过时区校验（延迟不影响批次正确性）"
          elif [ -n "${{ inputs.batch }}" ]; then
            BATCH="${{ inputs.batch }}"
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (手动指定)"
          else
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then
              BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then
              BATCH="noon"
            else
              BATCH="evening"
            fi
            echo "batch=$BATCH" >> $GITHUB_OUTPUT
            echo "运行: $TODAY $BATCH 批次 (auto-detected, CST=$HOUR:00)"
          fi

          # 时区校验 — 仅对 auto-detect（无手动指定批次）执行
          if [ "${{ github.event_name }}" != "schedule" ] && [ -z "${{ inputs.batch }}" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            valid=true
            case "$BATCH" in
              morning)
                if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                  echo "❌ 时区错误！morning 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              noon)
                if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                  echo "❌ 时区错误！noon 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
              evening)
                if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                  echo "❌ 时区错误！evening 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                  valid=false
                fi ;;
            esac
            if [ "$valid" = false ]; then
              echo "🔧 如果是手动触发，请指定正确的 batch 参数"
              exit 1
            fi
            echo "✅ 时区校验通过"
          fi

          # 幂等保护：防止同批次重复生成
          echo "   检查批次是否已执行..."
          SKIP=$(TODAY="$TODAY" BATCH="$BATCH" python3 scripts/check_batch_completed.py)
          if [ "$SKIP" = "true" ]; then
            echo "⏭️  批次 ${BATCH} 今日已完成，跳过"
            exit 0
          fi
          echo "   批次 ${BATCH} 尚未执行，继续"

      - name: 生成文章
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python orchestrator.py "${{ steps.params.outputs.today }}" --batch="${{ steps.params.outputs.batch }}"

      - name: 发布到头条号
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TOUTIAO_AUTH_FILE: /tmp/auth/toutiao_auth.json
          OUTPUT_DIR: ${{ runner.temp }}/output
        run: |
          python publisher.py "${{ steps.params.outputs.today }}" --headless

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ steps.params.outputs.batch }}-${{ steps.params.outputs.today }}
          path: ${{ runner.temp }}/output/${{ steps.params.outputs.today }}/

      - name: 失败通知
        if: failure()
        env:
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python -c "
          import requests
          requests.post('https://wxpusher.zjiecode.com/api/send/message',
            json={'appToken':'$WXPUSHER_APPTOKEN','content':'⚠️ ${{ steps.params.outputs.batch }} 批次发布失败\n日期: ${{ steps.params.outputs.today }}\n查看: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}','contentType':1,'uids':['$WXPUSHER_UID']})
          "
