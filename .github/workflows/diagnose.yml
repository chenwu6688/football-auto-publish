name: 诊断-TokenHub-LLM

# 临时诊断：复现 daily.yml 的"生成文章"步骤并捕获完整输出/回溯，
# 写入 data/gen_error.log 并提交，便于沙箱读取。排查完成后删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -q -r requirements.txt

      - name: 复现 生成文章 并捕获错误
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "TODAY=$TODAY"
          python orchestrator.py "$TODAY" --batch=auto > /tmp/gen.log 2>&1
          RC=$?
          {
            echo "=== orchestrator exit code = $RC ==="
            echo "TODAY=$TODAY  BATCH=auto"
            echo "=== last 12000 chars of output ==="
            tail -c 12000 /tmp/gen.log
          } > data/gen_error.log
          echo "----- captured -----"
          cat data/gen_error.log

      - name: 提交诊断结果
        if: always()
        run: |
          git config user.email "vecly@outlook.com"
          git config user.name "chenwu6688"
          git add -f data/gen_error.log data/llm_diag.txt
          git commit -m "chore(diag): orchestrator 生成错误回溯 [skip ci]" || echo "no change to commit"
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git rebase origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "PUSHED"; break; fi
            echo "push attempt $i failed, retrying..."; sleep 4
          done
