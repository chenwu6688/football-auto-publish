name: 诊断-TokenHub-LLM

# 临时诊断：复现 daily.yml 的"生成文章"步骤并捕获完整输出/回溯，
# 写入 data/gen_error.log 并提交，便于沙箱读取。排查完成后删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -q -r requirements.txt
          playwright install chromium --with-deps

      - name: 复现 生成文章 并捕获错误
        env:
          HY3_API_KEY: ${{ secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          set +e
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "TODAY=$TODAY"
          python orchestrator.py "$TODAY" --batch=auto > /tmp/gen.log 2>&1
          RC=$?
          {
            echo "=== orchestrator exit code = $RC ==="
            echo "TODAY=$TODAY  BATCH=auto"
            echo "=== last 12000 chars of output ==="
            tail -c 12000 /tmp/gen.log
          } > data/gen_error.log
          echo "----- captured -----"
          cat data/gen_error.log
          exit 0

      - name: 复现 发布到头条号 并捕获错误
        env:
          TOUTIAO_AUTH_FILE: toutiao_auth.json
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          set +e
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "=== 解码头条号登录状态 ==="
          mkdir -p /tmp/auth
          echo "${{ secrets.TOUTIAO_AUTH_GZ }}" | base64 -d | python3 -c "import sys,gzip; sys.stdout.buffer.write(gzip.decompress(sys.stdin.buffer.read()))" > toutiao_auth.json
          echo "auth file size: $(wc -c < toutiao_auth.json 2>/dev/null)"
          echo "=== 执行 publisher ==="
          python publisher.py "$TODAY" --headless > /tmp/pub.log 2>&1
          RC=$?
          {
            echo "=== publisher exit code = $RC ==="
            echo "TODAY=$TODAY"
            echo "auth_ok=$([ -s toutiao_auth.json ] && echo yes || echo no)"
            echo "=== last 12000 chars of output ==="
            tail -c 12000 /tmp/pub.log
          } > data/pub_error.log
          echo "----- captured -----"
          cat data/pub_error.log
          exit 0

      - name: 提交诊断结果 (via API)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for FILE in data/gen_error.log data/pub_error.log; do
            [ -f "$FILE" ] || echo "(missing $FILE)" > "$FILE"
            CONTENT=$(base64 -w0 "$FILE")
            REPO="${{ github.repository }}"
            SHA=$(gh api "repos/$REPO/contents/$FILE?ref=main" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/$REPO/contents/$FILE" \
                -f message="chore(diag): $FILE [skip ci]" \
                -f content="$CONTENT" -f branch=main -f sha="$SHA" >/dev/null && echo "UPDATED $FILE"
            else
              gh api --method PUT "repos/$REPO/contents/$FILE" \
                -f message="chore(diag): $FILE [skip ci]" \
                -f content="$CONTENT" -f branch=main >/dev/null && echo "CREATED $FILE"
            fi
          done
          echo "commit step done"
