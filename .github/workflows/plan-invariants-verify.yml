name: 计划结构不变量验收（6.1/6.2/8.1/11.5/12.2/12.4/13.2/13.4/第十章/策略手册第五章）

# 补齐计划剩余验收条款的可执行校验：这些条款此前有落地实现但无验证物。
#
# ▼ 2026-11-04 触发条件改版（频率反转）
# 这一批验的是**口径**：代码接没接、常量三处自不自洽、禁用词表齐不齐。
# 这类结论只在「代码/Prompt/配置变了」时才会变，此前却每周一固定跑一次——
# 于是同一个结论一周复述一遍，而真正每天都该看的发布成功率/无封面率反而没人看
# （那部分已挪到 daily-result.yml）。现在改成：
#   · 代码/Prompt/配置变更 → 立刻跑（比等到下周一快得多，改动当天就能发现回归）
#   · 每周一 12:30 CST → 仍保留一次兜底（防止漏触发）
#
# 下列条目全部保留，只是不再「每周重复」而是「变更时跑」：
#   - 自动调参纪律与四道防呆（8.1 / 11.5）
#   - 事实层与量表（6.1 / 6.2 / 12.2 / 12.4）
#   - 数据源与信源清单（13.2 / 13.4）
#   - 验收指标与合规熔断（第十章）
#   - 单批篇数纪律（策略手册第五章 / 计划 12.1）
#   - 头条后台数据接入（第十章：主键唯一性 / 列名映射 / 标题匹配 / 无依赖 xlsx）
#   - 标题反模式闸门（3.3 / 第十章：赛果播报式硬规则与生成侧接入）
#   - 选题分类与类别优先级（5.1 / R11 内容诊断：有效选题优先级与战报比分软上限）
#   - 标题正向规则（3.3 / R11 内容诊断：悬念词+87% / 21-30字最优 / 赛事名词垫底 / 情绪词-15%）
#   - RedFox 热点数据试点（用户 2026-10-13 授权：只读/缓存/额度台账/信号只作输入；CI 无 Key 自动跳过实网探测）
#   - 发布时段纪律（3.3 / 第十章：主调度/兜底 cron 与死区护栏一致性）
#   - 信号饱和度体检（防无效信号规则：饱和字段不得参与维度加分 / 缺失不得被 0 冒充）
#   - 标题锚点与疑问收尾限额（P0-1，2026-11-01 头部对标：锚点覆盖 ≥40% / 疑问收尾 14 天 ≤2 篇）
#   - 单事件多切口编排（P0-2，2026-11-01 头部对标：六角度池 / 仅 S 级 / 同事件标题不撞车）
#   - 封面覆盖率（2026-11-01 体系体检：零配图发布 ≤5% / 实体→维基已接入 / 尺寸闸门 ≥800×600）
# 注：标题锚点、单事件多切口、封面覆盖率、L3 留证等为**硬门禁**（不带 || echo），其余只告警。
on:
  push:
    paths:
      - '**.py'
      - 'config/**'
      - 'prompts/**'
      - 'requirements.txt'
      - '.github/workflows/plan-invariants-verify.yml'
  pull_request:
    paths:
      - '**.py'
      - 'config/**'
      - 'prompts/**'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 每一步都必须带 if: always()：任一验收失败不许 skip 后面的步骤。
      # 2026-11-06 实测「标题锚点覆盖率」长期红（33.3% < 40% 目标），
      # 导致其后 15 个验收步骤全部 skipped —— 红灯之外什么都没验，
      # 观察期等于瞎眼。失败的步骤自己会把 job 标红，不需要中断来提示。
      - name: 检出代码
        if: always()
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 推送凭据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: always()
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 调参纪律与四道防呆（计划 8.1 / 11.5）
        if: always()
        run: |
          python3 scripts/verify_tuning_discipline.py --quiet \
            || echo "::warning::调参纪律未达 8.1/11.5 验收标准，详见 data/audit/tuning_discipline_latest.json"

      - name: 事实层与量表（计划 6.1 / 6.2 / 12.2 / 12.4）
        if: always()
        run: |
          python3 scripts/verify_fact_layer.py --quiet \
            || echo "::warning::事实层未达 6.1/6.2/12.2/12.4 验收标准，详见 data/audit/fact_layer_latest.json"

      - name: 数据源与信源清单（计划 13.2 / 13.4）
        if: always()
        run: |
          python3 scripts/verify_source_roster.py --quiet \
            || echo "::warning::数据源未达 13.2/13.4 验收标准，详见 data/audit/source_roster_latest.json"

      - name: 验收指标与合规熔断（计划第十章）
        if: always()
        run: |
          python3 scripts/verify_acceptance_metrics.py --quiet \
            || echo "::warning::验收指标未达第十章标准，详见 data/audit/acceptance_metrics_latest.json"

      - name: 单批篇数纪律（策略手册第五章 / 计划 12.1）
        if: always()
        run: |
          python3 scripts/verify_batch_quota.py --quiet \
            || echo "::warning::单批篇数纪律未达手册/计划标准，详见 data/audit/batch_quota_latest.json"

      - name: 头条后台数据接入（计划第十章）
        if: always()
        run: |
          python3 scripts/verify_performance_import.py --quiet \
            || echo "::warning::头条后台数据接入验收未通过（主键唯一性 / 列名映射 / 标题匹配 / 无依赖 xlsx），详见 data/audit/performance_import_latest.json"

      - name: 标题反模式闸门（计划 3.3 / 第十章）
        if: always()
        run: |
          python3 scripts/verify_title_antipattern.py --quiet \
            || echo "::warning::标题反模式闸门验收未通过（赛果播报式硬规则 / 生成侧接入），详见 data/audit/title_antipattern_latest.json"

      - name: 标题句式多样性（P0-3：同句式 14 天 ≤2 篇）
        if: always()
        run: |
          # 硬项，不加 || echo 软化：实测近 14 天 68 篇里「主帅压力体」16 次
          # （26 篇赛程稿中 19 篇同一句式），是「推文全是人物故事」的直接来源。
          python3 scripts/verify_title_templates.py --quiet

      - name: 赛季节点日历可信度（事实可追 / 揭晓时刻 / 生成侧接入）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：写金球奖节点时发现日历里的事实没有来源约束，
          # 查证时就撞到把「1996 萨默尔」算成「44 年金球荒」的稿子（实际 30 年）——
          # 单源事实不可信。故有 facts 必须有 fact_source_url，且过了 reveal_at 不许再生成。
          python3 scripts/verify_season_calendar.py --quiet

      - name: 揭晓型事件结果稿通道（多源交叉验证 / 时间闸门）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：金球奖开奖后全网都会出消息，不需要人工通报，
          # 但「抓来就写」＝把外媒预测当结论（10-26 10:28 懂球帝就有《【CBS Sports】姆巴佩夺金球》，
          # 而开奖在 10-27 03:00）。五道闸门任一被拆都会让这条通道变成编造入口，
          # 故时间闸门/多源门槛/冲突判定/生成侧接入/审计落盘全部按硬项验收。
          python3 scripts/verify_event_result.py --quiet

      - name: 内容类型配比（2026-11-01 月度分析：禁发类型 / 目标表自洽）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：10 月实测（按实际发布 93 篇口径）
          # 历史回顾篇均 0.9 阅读、榜单 0.5，仍在产出；而最能打的热点球评
          # 篇均 48.1 只占 16%，战术榜单 40% 却只有 21.2 —— 配比与绩效是反的。
          # 禁发类型再产出、或目标表与 reservoir 禁发清单漂移，都按硬项拦。
          python3 scripts/verify_content_mix.py --days 7 --quiet

      - name: 标题锚点与疑问收尾限额（2026-11-01 头部对标 P0-1）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：抓了 4 个头条足球头部号 181 条真实作品，
          # 头部锚点覆盖 7.2%~35.7%、疑问句 0%~20.2%；我方锚点 2.6%、疑问句 85.5%，
          # 中位阅读 8 对 5526/1090/77。而源头竟是我们自己在 prompt 里写死
          # 「必须以疑问？收尾」+ 评分器给「疑问收尾」30 分（权重最高一维）。
          # 词表清空 / prompt 又写回疑问收尾 / 锚点覆盖率跌破 40%，一律按硬项拦。
          python3 scripts/verify_title_anchor.py --days 7 --quiet

      - name: 封面覆盖率（2026-11-01 体系体检）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：10 月已发布 143 篇里 53 篇（37%）是
          # 「无封面」发出的——头条在正文 0 图时会主动设成无封面模式，而该路径
          # 聚合点击率 0.52%，有封面组 2.07%（差 4 倍）。链路三处断：手工表只有
          # 33 个实体、footyrenders 只返 50×50 占位图、Unsplash 无 Key + DDG 被挡。
          # 现在零配图率回潮 / 实体→维基那层被摘掉 / 尺寸闸门被放松，一律硬拦。
          python3 scripts/verify_cover_coverage.py --days 14 --quiet

      - name: 标题三要素闸门（2026-11-04 阅读量瓶颈 P0-1）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：88 篇真实稿 + 181 条头部样本回测，
          # 我方「数字/对比/专名」通过组中位阅读 14、被拦组 2，而头部通过率 70.7%
          # 对 60.2%。阈值定「≥2 项且必含专名」而不是三项全过——TOP1（494 阅读）
          # 只有 2/3，BOTTOM 里却有 3/3 的 0 阅读稿，三项全过既误杀又漏放。
          # 现在：尺子判据（我方单调 / 头部不低 / TOP10 ≥70% / 压力带）、出口接入、
          # 供给侧注入点被拆，一律硬拦。
          python3 scripts/verify_title_elements.py --quiet

      - name: 每批内容类型结构（2026-11-04 阅读量瓶颈 P1-1）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：content_mix.TARGET_PCT 是月度占比，
          # 一批 2 篇时「今天全发战术榜单」照样月度达标，而 10 月实际就是战术榜单 44%。
          # 单批结构必须单独管：main 槽（热点球评/紧急球评）+ data 槽（数据对比/排行榜），
          # 低效类型宁可少发也不凑数。结构被拆回单槽 / 禁发类型进主结构 / assign 被摘，
          # 一律硬拦。产出结构不足 8 篇时输出 ::warning:: 而非假绿。
          python3 scripts/verify_batch_mix.py --quiet

      - name: 发布成功率（2026-11-04 审核机制补缺）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。补的缺口：此前 38 个验收全在审「该不该发」，
          # 没有一个在看「发没发成」。11-04 午间 2 篇里 1 篇发布超时失败（无API响应），
          # 台账如实记了原因，但没有任何告警响。
          #   成功率 <85%（近 7 天）→ 硬拦；连续 ≥2 篇失败 → 硬拦（链路断了的信号，
          #   与比率无关：2 篇全败时比率 0%，20 篇败 2 篇时 90% 但属偶发）；
          #   失败无 reason → 硬拦（没原因的告警等于没告警）。
          # 样本 <5 篇时给 ⏸ 未判定 + ::warning::，不当绿灯。
          python3 scripts/verify_publish_success.py --days 7 --quiet

      - name: LLM 免费额度账本（2026-11-03 后台截图全量同步）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：TokenHub 无额度查询 API，账本靠人工截图填。
          # 手填有两个静默失败模式：① 本地少记 total_tokens → 运行期以为还有额度，
          # 继续往快用完的模型上打请求 → 直接按量计费（不报 402、直接扣钱）；
          # ② 拿后台 UI 名去调用（截图 mimo-v2.5-pro，真实 ID mimo-v2.6-pro）→ 必 404。
          # 现在：账本 total/剩余%/到期与快照对不上、轮换列表含按量计费或已停模型
          # （如 hy3「已停止 + 0%」），一律硬拦。
          python3 scripts/verify_llm_quota.py --quiet

      - name: 单事件多切口编排（2026-11-01 头部对标 P0-2）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：金球奖当天我爱英超发了 15 条、我方 1 条——
          # 不是写得少，是一个事件只写一个角度。角度池被清空、非 S 级事件触发、
          # 同事件标题撞车未拦、或编排没接进批次流程，都按硬项拦。
          python3 scripts/verify_event_cluster.py --quiet

      - name: 选题分类与类别优先级（计划 5.1 / R11 内容诊断）
        if: always()
        run: |
          python3 scripts/verify_topic_category.py --quiet \
            || echo "::warning::选题分类器验收未通过（类别优先级 / 战报比分软上限），详见 data/audit/topic_category_latest.json"

      - name: 标题正向规则（计划 3.3 / R11 内容诊断）
        if: always()
        run: |
          python3 scripts/verify_title_positive.py --quiet \
            || echo "::warning::标题正向规则验收未通过（悬念词/21-30字/赛事名词/情绪词），详见 data/audit/title_positive_latest.json"

      - name: 效果闭环（R11 内容诊断 / 计划第十章）
        if: always()
        run: |
          python3 scripts/verify_effect_loop.py --quiet \
            || echo "::warning::效果闭环验收未通过（单篇点击率派生 / 导出列直读 / 选题类型落盘 / 看板分组 / 导入透传），详见 data/audit/effect_loop_latest.json"

      - name: 转粉 + 互动引导闭环（R11 建议5 / 计划 13.5 / 第十章）
        if: always()
        run: |
          python3 scripts/verify_growth_loop.py --quiet \
            || echo "::warning::转粉/互动引导闭环验收未通过（转粉通道 / 缺列不冒充 0 / 看板口径 / 生成侧打回与兜底注入），详见 data/audit/growth_loop_latest.json"

      - name: 绩效回填自动化（R11 建议7）
        if: always()
        run: |
          python3 scripts/verify_perf_ingest.py --quiet \
            || echo "::warning::绩效回填自动化验收未通过（投递箱识别 / 幂等归档 / 失败不吞 / 滞后监控 / CI 接线），详见 data/audit/perf_ingest_latest.json"

      - name: RedFox 热点数据试点（用户 2026-10-13 授权 · 只读试点）
        if: always()
        run: |
          python3 scripts/verify_redfox_pilot.py --quiet \
            || echo "::warning::RedFox 试点验收未通过（配置/冒烟/台账隔离/信号表接入；CI 无 Key 时实网探测自动跳过），详见 data/audit/redfox_pilot_latest.json"

      - name: 发布时段纪律（计划 3.3 / 第十章）
        if: always()
        run: |
          python3 scripts/verify_publish_schedule.py --quiet \
            || echo "::warning::发布时段纪律验收未通过（主调度/兜底 cron 与死区护栏一致性），详见 data/audit/publish_schedule_latest.json"

      - name: 信号饱和度体检（防无效信号规则）
        if: always()
        run: |
          python3 scripts/verify_signal_saturation.py --quiet \
            || echo "::warning::信号饱和度体检未通过（饱和字段被接回维度加分 / 缺失被 0 冒充），详见 data/audit/signal_saturation_latest.json"

      - name: 采集失败分类（真空数据 ≠ 被拦）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：2026-10-26 懂球帝过腾讯 EdgeOne 返 HTTP 567
          # 挑战页，567 不在 403/429/404 分支里 → 重试耗尽 return "" → 备源静默归零，
          # 日志只报「懂球帝文章: 0 篇」。查了半天以为是没内容。
          # 现在：567/5xx 静默返回空、404 被记成 blocked、200 挑战壳未识别、
          # 台账被篡改而校验器不报错，一律硬拦。
          python3 scripts/verify_scraper_diagnostics.py --quiet

      - name: L3 打分留证（周审计的前提）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。起因：data/rank_audit 里 2026-10-10 那份「量表校准」
          # 10 条样本全是 来源=rule（冲突度 1.1 / 知名度 1.0 是规则公式恒给 1，不是模型偏好）。
          # 根因两条：① L4 缓存键用 topic-{i} 批内序号 → 同一天第二批 topic-0 复用第一批
          # 的分（命中缓存不花 token，日志看不出来）；② 缓存按日重置 → L3 分数每天被覆盖丢弃。
          # 现在：跨批串号、同题不命中缓存、留证被覆盖、周审计不读台账、缺维检不出，一律硬拦。
          python3 scripts/verify_rank_audit_persistence.py --quiet

      - name: 规则覆盖（规则表 ↔ 判据 ↔ 发布门禁 · 2026-11-06）
        if: always()
        run: |
          # 硬项，不加 || echo 软化。它防两种「不会自己报错」的失效：
          # ① 规则表里的判据名拼错 → verify_compliance 静默判「未判定」，报告看起来像没违规；
          # ② pre-publish 被慢慢塞回 quality/ops 项 → 生产线抖动就停发，与扣分无关。
          # 同时用「compliance 项数 ≤ 上限」给审核复杂度设一个可量化的天花板。
          python3 scripts/verify_rule_coverage.py --quiet

      - name: 合规审核负向自检（16 条判据必须真的在判）
        if: always()
        run: |
          # 硬项。每条 block 级规则都必须能被打红；打不红说明它是恒真的摆设，
          # 比没有这条规则更糟（它会让人以为「合规审过了」）。
          # 这里只跑 --selftest（合成样本，不读产物），所以任何机器上都可判定。
          python3 scripts/verify_compliance.py --selftest

      - name: 回写验收报告
        if: always()
        run: |
          git add -f data/audit || true
          if git diff --cached --quiet; then
            echo "无报告变更"
            exit 0
          fi
          git commit -m "chore(audit): 计划结构不变量验收报告（6.1/6.2/8.1/11.5/12.2/12.4/13.2/13.4/第十章）"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main || true
          done
