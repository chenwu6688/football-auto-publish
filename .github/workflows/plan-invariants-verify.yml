name: 计划结构不变量验收（6.1/6.2/8.1/11.5/12.2/12.4/13.2/13.4/第十章/策略手册第五章）

# 补齐计划剩余验收条款的可执行校验：这些条款此前有落地实现但无验证物。
# 每周一 04:30 UTC = 12:30 CST 校验（只告警不阻断）：
#   - 自动调参纪律与四道防呆（8.1 / 11.5）
#   - 事实层与量表（6.1 / 6.2 / 12.2 / 12.4）
#   - 数据源与信源清单（13.2 / 13.4）
#   - 验收指标与合规熔断（第十章）
#   - 单批篇数纪律（策略手册第五章 / 计划 12.1）
#   - 头条后台数据接入（第十章：主键唯一性 / 列名映射 / 标题匹配 / 无依赖 xlsx）
#   - 标题反模式闸门（3.3 / 第十章：赛果播报式硬规则与生成侧接入）
#   - 选题分类与类别优先级（5.1 / R11 内容诊断：有效选题优先级与战报比分软上限）
#   - 标题正向规则（3.3 / R11 内容诊断：悬念词+87% / 21-30字最优 / 赛事名词垫底 / 情绪词-15%）
#   - RedFox 热点数据试点（用户 2026-10-13 授权：只读/缓存/额度台账/信号只作输入；CI 无 Key 自动跳过实网探测）
#   - 发布时段纪律（3.3 / 第十章：主调度/兜底 cron 与死区护栏一致性）
#   - 信号饱和度体检（防无效信号规则：饱和字段不得参与维度加分 / 缺失不得被 0 冒充）
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 推送凭据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 调参纪律与四道防呆（计划 8.1 / 11.5）
        run: |
          python3 scripts/verify_tuning_discipline.py --quiet \
            || echo "::warning::调参纪律未达 8.1/11.5 验收标准，详见 data/audit/tuning_discipline_latest.json"

      - name: 事实层与量表（计划 6.1 / 6.2 / 12.2 / 12.4）
        run: |
          python3 scripts/verify_fact_layer.py --quiet \
            || echo "::warning::事实层未达 6.1/6.2/12.2/12.4 验收标准，详见 data/audit/fact_layer_latest.json"

      - name: 数据源与信源清单（计划 13.2 / 13.4）
        run: |
          python3 scripts/verify_source_roster.py --quiet \
            || echo "::warning::数据源未达 13.2/13.4 验收标准，详见 data/audit/source_roster_latest.json"

      - name: 验收指标与合规熔断（计划第十章）
        run: |
          python3 scripts/verify_acceptance_metrics.py --quiet \
            || echo "::warning::验收指标未达第十章标准，详见 data/audit/acceptance_metrics_latest.json"

      - name: 单批篇数纪律（策略手册第五章 / 计划 12.1）
        run: |
          python3 scripts/verify_batch_quota.py --quiet \
            || echo "::warning::单批篇数纪律未达手册/计划标准，详见 data/audit/batch_quota_latest.json"

      - name: 头条后台数据接入（计划第十章）
        run: |
          python3 scripts/verify_performance_import.py --quiet \
            || echo "::warning::头条后台数据接入验收未通过（主键唯一性 / 列名映射 / 标题匹配 / 无依赖 xlsx），详见 data/audit/performance_import_latest.json"

      - name: 标题反模式闸门（计划 3.3 / 第十章）
        run: |
          python3 scripts/verify_title_antipattern.py --quiet \
            || echo "::warning::标题反模式闸门验收未通过（赛果播报式硬规则 / 生成侧接入），详见 data/audit/title_antipattern_latest.json"

      - name: 标题句式多样性（P0-3：同句式 14 天 ≤2 篇）
        run: |
          # 硬项，不加 || echo 软化：实测近 14 天 68 篇里「主帅压力体」16 次
          # （26 篇赛程稿中 19 篇同一句式），是「推文全是人物故事」的直接来源。
          python3 scripts/verify_title_templates.py --quiet

      - name: 赛季节点日历可信度（事实可追 / 揭晓时刻 / 生成侧接入）
        run: |
          # 硬项，不加 || echo 软化。起因：写金球奖节点时发现日历里的事实没有来源约束，
          # 查证时就撞到把「1996 萨默尔」算成「44 年金球荒」的稿子（实际 30 年）——
          # 单源事实不可信。故有 facts 必须有 fact_source_url，且过了 reveal_at 不许再生成。
          python3 scripts/verify_season_calendar.py --quiet

      - name: 选题分类与类别优先级（计划 5.1 / R11 内容诊断）
        run: |
          python3 scripts/verify_topic_category.py --quiet \
            || echo "::warning::选题分类器验收未通过（类别优先级 / 战报比分软上限），详见 data/audit/topic_category_latest.json"

      - name: 标题正向规则（计划 3.3 / R11 内容诊断）
        run: |
          python3 scripts/verify_title_positive.py --quiet \
            || echo "::warning::标题正向规则验收未通过（悬念词/21-30字/赛事名词/情绪词），详见 data/audit/title_positive_latest.json"

      - name: 效果闭环（R11 内容诊断 / 计划第十章）
        run: |
          python3 scripts/verify_effect_loop.py --quiet \
            || echo "::warning::效果闭环验收未通过（单篇点击率派生 / 导出列直读 / 选题类型落盘 / 看板分组 / 导入透传），详见 data/audit/effect_loop_latest.json"

      - name: 转粉 + 互动引导闭环（R11 建议5 / 计划 13.5 / 第十章）
        run: |
          python3 scripts/verify_growth_loop.py --quiet \
            || echo "::warning::转粉/互动引导闭环验收未通过（转粉通道 / 缺列不冒充 0 / 看板口径 / 生成侧打回与兜底注入），详见 data/audit/growth_loop_latest.json"

      - name: 绩效回填自动化（R11 建议7）
        run: |
          python3 scripts/verify_perf_ingest.py --quiet \
            || echo "::warning::绩效回填自动化验收未通过（投递箱识别 / 幂等归档 / 失败不吞 / 滞后监控 / CI 接线），详见 data/audit/perf_ingest_latest.json"

      - name: RedFox 热点数据试点（用户 2026-10-13 授权 · 只读试点）
        run: |
          python3 scripts/verify_redfox_pilot.py --quiet \
            || echo "::warning::RedFox 试点验收未通过（配置/冒烟/台账隔离/信号表接入；CI 无 Key 时实网探测自动跳过），详见 data/audit/redfox_pilot_latest.json"

      - name: 发布时段纪律（计划 3.3 / 第十章）
        run: |
          python3 scripts/verify_publish_schedule.py --quiet \
            || echo "::warning::发布时段纪律验收未通过（主调度/兜底 cron 与死区护栏一致性），详见 data/audit/publish_schedule_latest.json"

      - name: 信号饱和度体检（防无效信号规则）
        run: |
          python3 scripts/verify_signal_saturation.py --quiet \
            || echo "::warning::信号饱和度体检未通过（饱和字段被接回维度加分 / 缺失被 0 冒充），详见 data/audit/signal_saturation_latest.json"

      - name: 回写验收报告
        if: always()
        run: |
          git add -f data/audit || true
          if git diff --cached --quiet; then
            echo "无报告变更"
            exit 0
          fi
          git commit -m "chore(audit): 计划结构不变量验收报告（6.1/6.2/8.1/11.5/12.2/12.4/13.2/13.4/第十章）"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main || true
          done
