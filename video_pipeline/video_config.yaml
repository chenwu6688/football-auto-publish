# ============================================================
# 数字人口播视频 · 生成侧配置（Phase 0+1 MVP · 免费·本地·CPU）
# 版本: 2026-09-20
# 适用: football-auto-publish/video_pipeline —— 文章 → 口播稿 → TTS → 字幕 → 竖屏视频
# 设计原则: 零新增成本、不碰现有图文发布链路、肖像合规（用老六本人照）
# ============================================================

# 肖像素材：用老六本人照片（用户自供）。在 M710q 上填绝对路径；留空则用渐变背景兜底。
portrait_path: ""          # 例: /home/chenwu/portraits/laoliu.jpg

# 声线（Edge TTS，免 key，免费）
voice:
  provider: "edge"         # edge（默认）| volcano（火山引擎，需 key）| clone（GPT-SoVITS，预留）
  default: "zh-CN-YunjianNeural"    # 云健（男声·更具张力/激情，适合体育解说吐槽）
  # 备选男声（按此顺序降级尝试，避免单音色抽风）:
  #   zh-CN-YunxiNeural（云希·沉稳专业，通用解说/资讯）
  #   zh-CN-YunyangNeural（晓睿·男声）
  fallback_order:
    - "zh-CN-YunjianNeural"
    - "zh-CN-YunxiNeural"
    - "zh-CN-YunyangNeural"
  rate: "+12%"             # 语速：加快节奏、更有激情（" -8%" 更稳重 / "+12%" 紧凑激情）
  volume: "+0%"
  pitch: "+0Hz"

# 声线克隆（GPT-SoVITS / CosyVoice2，预留，默认关；拿到参考音后再开）
# 声线克隆（GPT-SoVITS，Phase 2，默认关；装好服务、备好参考音后再开）
# 推荐"免训练 few-shot"：用预训练底座 + 参考音 + 参考文本即可复刻声线（CPU 可跑）。
clone:
  enabled: false
  reference_audio: ""      # 老六参考音 .wav（已备：voice_ref/reference_voice.wav，建议 10-60s 清晰人声）
  model_dir: ""            # 已训练模型权重目录；留空则走 few-shot（不需训练）
  host: "127.0.0.1"        # 本地 GPT-SoVITS 推理服务地址（先 `python <GPT-SoVITS>/api.py -a 127.0.0.1 -p 9880`）
  port: 9880
  prompt_text: ""          # 参考音对应的文本（few-shot 更稳，建议填）
  timeout: 600             # 推理超时（秒）

# 火山引擎 TTS（可选升级项：字节系原生适配抖音，28 种情感/风格男声；需 key）
volcano:
  enabled: false
  app_id: ""
  token: ""
  cluster: ""
  speaker: ""              # 具体音色 Speaker ID（挑体育解说/侃爷风格流量向）

# 真·说话数字人（Phase 2，默认关；M710q 无独显，SadTalker CPU 跑 60-90s 视频可能要几十分钟）
# 开启后：肖像 + 配音 → SadTalker 说话脸（失败回退 Wav2Lip，再失败回退静态肖像 Ken-Burns）。
talking_head:
  enabled: false
  engine: "sadtalker"      # sadtalker（主）| wav2lip（兜底）
  python: "python"         # 各自仓库的解释器（含 torch 的 venv/conda）
  device: "cpu"            # cpu | cuda
  size: 256                # SadTalker 输出尺寸（256 轻量；512 更清晰更慢）
  preprocess: "full"       # crop（裁脸）| full（全图）
  pose: "none"             # none | static | clone
  batch_size: 1
  sadtalker_dir: ""        # SadTalker 仓库根目录（必填，如 /opt/SadTalker）
  wav2lip:
    dir: ""                # Wav2Lip 仓库根目录
    checkpoint: ""         # 预训练权重 .pt 路径（必填才有兜底）

# 素材剪接（Phase 3：根据口播内容自动检索相关素材做 B-roll 切剪，提升"自然感"）
# 默认关。开启后：口播稿抽关键词 → 搜素材(Pexels/Pixabay 免费视频API / 本地素材库) →
# 按句时间轴切替 → ffmpeg 多轨剪接(crossfade 转场 + 花字条) → 竖屏 mp4。
# 素材搜不到/失败 → 自动回退纯主讲人层（绝不卡出片）。
footage:
  enabled: true
  # 素材来源（按优先级尝试，直到搜到足够条数）:
  #   pexels_video   —— Pexels 免费视频 API（免版权·可商用转发；需 key）
  #   pixabay_video  —— Pixabay 免费视频 API（免版权·可商用转发；需 key）
  #   local          —— 你自己的本地素材库（零版权风险；需填 local_dir）
  #   pexels_image   —— Pexels 免费图片当 B-roll（Ken-Burns 动起来；比视频轻）
  sources:
    - "pexels_video"      # Pexels 免费视频（需 key）
    - "pexels_image"      # Pexels 免费图片当 B-roll（Ken-Burns 动起来，视频+图片混合更自然）
    - "local"             # 本地素材库兜底（仅当联网源一无所获时才用；需填 local_dir）
  # 检索关键词数量（规则法从口播稿抽取；llm_keywords=true 时可由 LLM 提取更准实体）
  keywords: 6
  # 每个关键词最多下载的素材条数（总池上限受 max_clips 约束）
  per_query: 4
  # 一次成片最多用多少段素材（避免素材喧宾夺主，主讲人仍是主体）
  max_clips: 12
  # 单段素材最短/最长时长（秒），过长会被裁，过短会被滤。
  # 注意：B-roll 段时长由口播句长决定（通常 1-4s），素材会被 trim 到该时长，
  # 所以这里放宽上限，避免把 10-15s 的优质中景素材误删（默认只保留 <=15s）。
  min_clip_dur: 1.0
  max_clip_dur: 15.0
  # 关键词抽取：规则为主（球队/球星/赛事词库）→ 命中即作为搜索词
  # llm_keywords: true 时若提供 llm_fn 可让 LLM 提 3-5 个更语义化的词（兜底回退规则）
  llm_keywords: false
  # 转场时长（秒），相邻素材之间 crossfade
  xfade: 0.4
  # 花字条(lower-third)开关：底部标题条，强化"专业感"
  lower_third: true
  # 缓存目录（已下载素材复用，避免重复请求 API）
  cache_dir: "assets/footage_cache"
  # —— 各来源凭证/目录 ——
  pexels_api_key: "seLZYNKMTsal4RLmKofu6OUJU6v8DI5ETKQCiABw27yNsKH5qQiDx7IT"   # https://www.pexels.com/api/ 免费申请
  pixabay_api_key: ""      # https://pixabay.com/api/docs/ 免费申请
  local_dir: "assets/footage_local"  # 本地素材库（相对仓库根）。已预置一批免版权足球图（球场/球/球迷/球门）作兜底

# 主讲人出镜控制（开场去真人）
# show_portrait=false 时不使用真人肖像作为锚层/背景，改用深色渐变底；
# 配合 teams 用球队标识开场，实现"不露脸也能有画面"。
host:
  show_portrait: false     # 是否在视频中露出真人肖像（false=去真人出镜）

# 开场球队标识（根据口播稿自动识别球队 → 拉队标/球场图开场，替代真人出镜）
# 队标双源：① Wikimedia（自由版权，首选）→ ② api-sports 队标 CDN（无需 key，直链稳，兜底）。
# 识别用内置中文球队词表；可用 local_map 补冷门/中超球队。
# 识别不到球队/拉取失败 → 自动跳过，不影响出片。
teams:
  enabled: true            # 是否启用开场球队标识
  cache_dir: "assets/teams"  # 队标/球场图缓存目录（重复运行不重复请求）
  stadium: true            # 是否同时拉主场球场图（false 只拉队标，更省请求）
  local_map: "assets/teams/teams_local.json"  # 本地球队覆盖表（补中超/冷门队；文件不存在则忽略）

# 音频氛围（背景音乐 + 关键词音效）
# 见 audio_mix.py：BGM 循环铺底（压低音量）→ 按字幕关键词在对应时刻叠加音效。
# bgm_dir / sfx_dir 放你自己的免版权音乐/音效文件（.wav/.mp3 等），留空则跳过对应部分。
audio:
  enabled: true            # 是否启用音频混音（无素材时自动跳过，用原旁白）
  bgm_dir: "assets/bgm"    # 背景音乐目录（取其中第一条曲目）
  sfx_dir: "assets/sfx"    # 音效目录（按关键词映射文件名，见 audio_mix.DEFAULT_KEYWORD_MAP）
  bgm_volume: 0.18         # BGM 音量（≈-18dB，压低当底衬，不盖过旁白）
  sfx_volume: 0.40         # 音效音量（≈-8dB，点到为止）
  master_volume: 1.0       # 总音量（保留旁白主音量）
  bgm_fade_out: 1.0        # BGM 结尾淡出时长（秒）

# 视频合成
video:
  width: 1080
  height: 1920
  fps: 30
  # 无肖像时的背景兜底: "gradient"（深蓝黑渐变）| "color"（纯色）
  background_fallback: "gradient"
  bg_color: "0x10131A"     # 纯色兜底色（BGR 十六进制）
  ken_burns: true          # 肖像缓慢推拉（提升观感，CPU 轻负载）
  # 字幕样式（ffmpeg subtitles force_style，适配手机竖屏）
  subtitle:
    # ⚠️ font_name 必须指定中文字体，否则 libass 回退 Arial（无中文字形）→ 汉字变方框（乱码）
    # 走 fontconfig 族名。仓库已内置 assets/fonts/NotoSansCJK-Bold.ttc，系统装了 Noto 即可命中。
    font_name: "Noto Sans CJK SC"
    font_size: 54
    primary_color: "0xFFFFFF"   # 白
    outline_color: "0x000000"   # 黑描边
    outline: 4
    back_color: "0x80000000"    # 半透明黑底（&H 格式，BGR+A）
    margin_v: 150
    max_chars_per_line: 15      # 字号放大后每行收短，避免横向溢出 1080 宽

# ============================================================
# 纯文字动效口播（抖音口播号风格）—— 推荐开启
# 不搜网素材、不露真人：深色动态渐变底 + 整屏大字逐句弹出 + 关键词自动高亮 + 队标小图标点缀。
# 开启后自动跳过 footage B-roll 与二次合成（字幕在动效渲染里直接烧录），单趟 ffmpeg 出片。
# 关键收益：背景是一条贯穿全片的渐变源 → 物理上不会黑屏；成片时长 ≡ 音频时长 → 不会切末句；
#          用内置中文字体 → 不会出现方框乱码。
# ============================================================
textmotion:
  enabled: true               # 开启纯文字动效（抖音口播号风格）
  font_path: ""               # 中文字体绝对路径；留空自动探测（优先仓库 assets/fonts/NotoSansCJK-Bold.ttc）
  body_font_size: 96          # 正文字号（长句会自动缩小到不溢出，下限 56）
  max_chars_per_line: 9       # 每行最多几个全角字（超出折行）
  text_color: "0xE8ECF4"      # 正文色（冷白）
  hl_color: "0xFF3B30"        # 关键词高亮色（红）
  num_color: "0xFFD60A"       # 比分/时间等数字色（黄，最抢眼）
  outline: 6                  # 文字描边粗细（深底上更清晰）
  outline_color: "0x10131A"   # 描边色
  in_anim: "pop"              # 入场动效：pop（弹出·推荐）| slideup（上滑）| fade（淡入）
  keyword_stagger: 0.15       # 关键词比正文晚弹入的秒数（制造"砸下来"的击打节奏）
  max_kw_per_sentence: 3      # 每句最多高亮几个词（避免满屏花）
  extra_words: []             # 额外自定义高亮词（如球队昵称、黑话）
  # 动态渐变底（一条源贯穿全片，绝不会黑屏）
  bg_colors:                  # 渐变底色（2~8 个 '0xRRGGBB'）
    - "0x22365C"              # 深蓝
    - "0x141A28"              # 近黑（有底噪，非纯黑）
    - "0x3A2450"              # 暗紫
  bg_speed: 0.02              # 渐变流动速度（越小越缓慢高级）
  bg_type: "radial"           # radial（径向光晕·推荐）| linear（线性）
  # 队标点缀（小图标，非全屏）
  crest: true                 # 是否用水队标当小图标点缀（需 teams.enabled）
  crest_size: 170             # 队标像素尺寸（约 16% 屏宽，只做点缀）
  crest_y: 0.78               # 队标纵向位置（0=顶 1=底）
  crest_glow: true            # 队标加柔光光晕（更高级）
  keep_ass: false             # 是否保留生成的 .ass（排查用）

# 输出
output:
  base_dir: "output/videos"     # 相对仓库根目录；实际落盘 base_dir/YYYY-MM-DD/
  keep_intermediate: true       # 保留 wav/srt 中间文件便于排查（关掉可省空间）
